<style>
/* Layout: one 560px study column. Every word lives on a ring-bound 単語カード; red ink + 赤シート for hiding answers; tab bar at the bottom. */
/* Colour meanings (one each, everywhere):
     accent = what you press, the current choice, links      red = reviews that are due, and the red ink under the 赤シート (nothing else)
     again = wrong / 知らない / もう一度      hard = 難しい / Good / 連続正解      good = correct / 覚えた
     easy = 知ってる / Excellent      perfect = Perfect only      streak = the 連続記録 only
   --again / --hard / --good are for bars, borders and fills; as text use --again-t / --hard-t / --good-t (readable on light fills too).
   New CSS uses them with the old colour as a fallback, e.g. var(--again-t,var(--again)).
   Type scale (px), seven steps and nothing between: 12 a caption (a label, a unit, a badge, the line under a title) / 13.5 a
     sentence of its own, a small button or chip / 15 body and UI / 18 a lead (a card's meaning, a heading in a card, a main
     button) / 22 a page or sheet title / 30 a big number / 44 display (the word on its card, the streak). A word or count that
     grows with the screen (clamp) runs between two steps and lands on one at 375px; inputs stay 16px (iOS zooms under it); SVG
     chart text is in viewBox units. Japanese in two weights: 700 for a heading, a label or a button, 400 for a description or a
     unit. Running text (a sentence or more) at line-height 1.7.
   Tap areas about 44px (--tap). Spacing 4 / 8 / 12 / 16 / 24.
   Motion, three kinds and never longer than .24s, no bounce: a thing entering eases out (--ease-out, .15–.2s), a thing leaving eases in
     (--ease-in, .2s), a state changing (a press, a switch, a colour) eases both ways (--ease-io, .08–.15s). Once, when it happens; a redraw
     never replays it. prefers-reduced-motion stops all of it (rule near the end).
   The tokens below hold these values; older rules still write the numbers. */
:root{
  --accent-ink:#FFFFFF; --red:#D2363C; --red-soft:#FBE3E3; --sheet:#E04A50; --marker:#FFE45C; --hl:linear-gradient(transparent 12%,#FFE45C 12% 94%,transparent 94%); --hl-ink:var(--ink); --ring:#A9B1BE;
  --good:#167F56; --good-soft:#DCF2E8; --sg1:#F4A58A; --sg2:#EFC27A; --sg3:#7FCFA9; --sg4:#8FB1EE; --sg1f:#FBD3C4; --hard:#A8650C; --hard-soft:#FAEBD4; --again:#D9480F; --again-soft:#FDE6DC; --easy:#2259B8; --perfect:#8A3FD1; --easy-soft:#DEE8FA;
  --again-t:#B93E0C; --hard-t:#8A5208; --good-t:#126B48; --memo-ink:#2b2508; --streak:#F2701F; --streak-ink:#3B1A05; --streak-t:#A84A0B; --sw-off:var(--line);
  --streak-soft:#FFF0E4; --accent-edge:color-mix(in srgb,var(--accent) 68%,#0A1240); --ghost-edge:#CBD2DD;   /* the goal band; the edge under the home's buttons */
  --shadow:0 1px 2px rgba(23,32,46,.06),0 8px 22px rgba(23,32,46,.07);
  --r:14px;
  --tap:44px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --dur-1:.15s; --dur-2:.2s; --dur-3:.24s; --ease-out:cubic-bezier(.2,.8,.3,1); --ease-in:cubic-bezier(.4,0,.8,.3); --ease-io:cubic-bezier(.45,0,.35,1);
}

/* ===== 新デザイン（方向性E「棚」: docs/ui_redesign/E/notes.md） =====
   Every screen is redone (ui2, steps 1-5): the new values sit under the old names (--bg --ink --f-ui --fs-body --fs-sub), and the
   old names of the parts drawn the old way (--surface --line --muted --accent …) point at the new ones, so a sheet or the
   高速仕分け in its old markup reads as the same page. The tokens above are the old ones still used (grades, the 4択's colours …).
   New classes start with k- so that the old rules (.cover .ring .pill .sec .shelf .bar .more .choice .empty …) never reach them. */
:root{
  /* the old names (the parts not redrawn: sheets, the 高速仕分け, the first run …) take the new values */
  --surface:var(--bg); --surface-2:var(--fill); --pop:var(--bg); --line:var(--hair); --muted:var(--ink-2); --faint:var(--ink-3);
  --accent:var(--blue); --accent-soft:var(--blue-tint); --accent-2:color-mix(in srgb,var(--blue) 40%,transparent); --f-word:var(--f-en); --f-num:var(--f-en);
  --st-master:var(--blue); --st-learn:color-mix(in srgb,var(--blue) 42%,var(--bg)); --st-new:var(--track);
  --bg:#FFFFFF; --ink:#121216; --ink-2:#5E5E68; --ink-3:#8C8C96; --ink-tab:#6E6E78; --fill:#F2F2F5; --hair:rgba(18,18,22,.09); --track:rgba(18,18,22,.18);
  --logo:#083FF9; --blue:#2A45D8; --blue-hero:#2A45D8; --blue-tint:#EAEEFD; --orange:#F07A1E; --orange-track:#FBDCC3; --on-blue:#FFFFFF;
  /* one colour a deck: its started cover (--c-), the hero behind it alone (--h-, 12%+ darker), its card's tint (--t-) */
  --c-kiso:#2E7D5B; --c-hyojun:#C9472E; --c-hatten:#7B4A2D; --obi-juku:#8A6D1F; --obi-tagi:#A8486C; --obi-theme:#5E6B30; --obi-chu:#4F6475; --obi-toeic:#7A3F73; --obi-my:#55515A;

.brand-mark i{position:absolute;inset:0;background:currentColor;-webkit-mask:var(--brand) center/100% 100% no-repeat;mask:var(--brand) center/100% 100% no-repeat}

/* the sheet: [hidden] really hides (.fb-body / .fb-actions are display:flex); a sayex at a line end doesn't scroll it sideways */
.fb [hidden]{display:none}
.fb .fb-body{overflow-x:hidden}
/* 詳しく open: the sheet grows to its content, up to just below × and 1問もどす */
.fb:has(#fbmore:not([hidden])){max-height:calc(100% - 64px)}
/* a miss: when it comes back, 押し間違えた on your own answer (not next to 次へ) */
.ivl.again{font-family:var(--f-ui);font-weight:700;color:var(--again-t,var(--again));background:var(--again-soft)}
/* a right answer that opens what comes next: 「＋2つ目の意味」「＋派生語」 beside 次は… */
.ivl.nx{font-family:var(--f-ui);font-weight:700;color:var(--accent);background:var(--accent-soft);white-space:nowrap}
.inl-fb .ivl.nx{margin-left:-6px}
.cmp-undo{margin:-12px -6px -12px auto;padding:0 6px;min-height:44px;font-size:13.5px;font-weight:700;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
/* a new word's card turns over on a tap anywhere; the word keeps its place and the back is added below it */
.qcard.flashc{cursor:pointer}
.qcard.flashc .qcard-in{justify-content:flex-start;padding-top:clamp(36px,10vh,96px)}
.qcard.flashc .qcard-in>:first-child{margin-top:0}
.qcard.flashc .qcard-in>:last-child{margin-bottom:0}
/* the key numbers mean nothing on a phone; after the answer ○ / × show in the same box (.choice.ok/.ng .key) */
@media (hover:none) and (pointer:coarse){.choice .key{color:transparent;border-color:transparent}}
/* スペル: every button above the field, 答える beside it, so the keyboard covers nothing */
.spell-btns .btn{min-height:40px}
.spell-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.spell-row .btn{min-height:56px}
.spell input{min-width:0}
.spell input.ng{font-size:18px}
.spell input.near{border-color:var(--hard);background:var(--hard-soft)}
/* おしい (one letter off): the letter that differs is marked on both words; the sheet rides on the keyboard while the word is typed once more */
.fb.near{border-top-color:var(--hard);bottom:var(--kb,0px);max-height:min(66%,560px,calc(100% - 56px - var(--kb,0px)))}
.fb.near:has(#fbmore:not([hidden])){max-height:calc(100% - 64px - var(--kb,0px))}
.fb.near .fb-head{color:var(--hard-t)}
.mk.n{background:var(--hard-soft);color:var(--hard-t)}
.cmp .cw{font-family:var(--f-word);font-size:18px;letter-spacing:.02em}
.cw mark{background:var(--hard-soft);color:var(--hard-t);font-weight:700;border-radius:3px;padding:0 1px;text-decoration:underline 2px;text-underline-offset:3px}
.cw mark.gap{display:inline-block;width:2px;height:1em;padding:0;margin:0 2px;vertical-align:-2px;background:var(--hard)}
.retype{flex:1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.retype input{min-width:0;font-family:var(--f-word);font-size:22px;text-align:center;height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);outline:none}
.retype input:focus{border-color:var(--accent)}
.retype input.ng{border-color:var(--again);background:var(--again-soft);animation:shake var(--dur-3) var(--ease-out)}
.retype .btn{min-height:52px}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
/* results: each word opens its explanation; the speed grades counted */
.sheet-h h3[lang="en"]{font-family:var(--f-word);font-size:22px}
.rate.tx{color:var(--again-t,var(--again));font-style:normal;font-family:var(--f-ui)}
/* the day's goal reached: the streak in big type, counting up by one */
.stk-win.stk-big{flex-direction:column;width:100%;padding:18px 16px;gap:6px;text-align:center}
.stk-win.stk-big>div{align-items:center;text-align:center}
.stk-win.stk-big .stk-flame .ico{width:56px;height:56px}
.stk-win.stk-big .stk-nrow{flex-direction:row;align-items:baseline;gap:4px}
.stk-win.stk-big .stk-nrow span{font-size:15px;font-weight:700;color:var(--ink)}
.stk-win.stk-big .stk-n{font-family:var(--f-word);font-size:44px;line-height:1;color:var(--streak-t,var(--streak))}
.stk-win.stk-big .stk-n.pop{animation:numin var(--dur-2) var(--ease-out)}   /* N-1 → N: the new number slides in, no bounce */
@keyframes numin{from{opacity:0;transform:translateY(5px)}}
.stk-win.stk-big .stk-msg{font-size:15px;font-weight:700;color:var(--ink)}
.stk-win.stk-big .week{display:grid;width:100%}
.stk-win.stk-big .wd.on:last-child i{animation:dotin var(--dur-3) .4s var(--ease-out) both}   /* today's dot fills in with the number */
@keyframes dotin{from{opacity:0;transform:scale(.7)}}
/* 高速仕分け: the buttons sit at the bottom edge with the counts inside; the red band says it opens */
.screen-in.sw{height:100%;min-height:0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.sw .swarea{flex:1 1 auto;height:auto;min-height:240px;max-height:480px;margin-top:20px}
.swfoot{margin-top:auto;padding-top:14px}
.swfoot .swbtns{margin-top:10px}
.swbtns .btn{gap:4px;padding:0 8px;white-space:nowrap;flex-wrap:wrap;column-gap:4px;row-gap:0;line-height:1.2}
/* a narrow row (文字「大」): smaller type keeps each button on one line; the wrap above is the fallback */
.swfoot{container-type:inline-size}@container (max-width:340px){.swbtns{gap:6px}.swbtns .btn{font-size:13.5px;padding:0 4px}}
.swn{margin-left:2px;font-size:13.5px;opacity:.8}
.swmean{position:relative}
.swmean.hide{min-width:8em;background:color-mix(in srgb,var(--sheet) 88%,#000)}
.swmean.hide::after{content:"タップで意味";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;letter-spacing:.06em}
/* 派生語: the chips open on a tap */
.fam-sub{margin-left:6px;font-weight:400;letter-spacing:0}
.fchip::after{content:"›";color:var(--faint);font-size:13.5px;margin-left:-2px}
.fchip.on::after{content:none}
/* VoiceOver: one short line per answer (#sr) */
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
/* a short screen (iPhone SE, 文字「大」; fitCheck): the study screens pack tighter so わからない stays in view */
.short .qtop{padding-block:2px 0}
.short .qclock,.short .screen-in.study>.qtimer{margin-top:6px}
.short .qclock + .qstage,.short .qtimer + .qstage{margin-top:18px}
.short #qbody{padding-top:10px}
.short .choices{gap:6px}
.short .choice{height:auto;min-height:48px;padding-block:4px}
.short .dunno{margin-top:2px;padding:6px 18px}
.short .dunrow,.short .inl-fb{margin-top:2px}
.short .qstage{min-height:120px}
.short .qstage .behind{display:none}
.short .qcard-in{padding:28px 16px 10px}
.short .qcard.flashc .qcard-in{padding-top:28px}
.short .grades{margin-top:10px}
.short .grade{padding-block:7px}
.short .sw .swarea{min-height:200px}
/* 後半の4択（文脈・語法）, 語源・コアイメージ・接辞, 紛らわしい語の見分け方, 英単語を貼るだけ */
.qctx{font-family:var(--f-word);font-size:18px;line-height:1.55;color:var(--ink);max-width:30ch;overflow-wrap:anywhere}
.qask b.qw{color:var(--ink);font-family:var(--f-word);font-weight:600}
.ety{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;font-size:13.5px;line-height:1.6;color:var(--muted)}
.ety-k{display:inline-block;margin-right:8px;color:var(--muted);font-family:var(--f-ui);font-size:12px;font-weight:700}   /* 成り立ち・コア・語法: a grey bold label, not a blue pill (blue is for what you press) */
.ety .ep{font-family:var(--f-word);font-weight:600;color:var(--ink)}
.ety i{font-style:normal;margin:0 5px;color:var(--faint)}
.ety-ch b{color:var(--ink)}
.usenote{display:flex;flex-direction:column;gap:2px}
.usenote .why{font-size:13.5px;font-weight:700;color:var(--ink)}
.usenote .fb-ex b{color:var(--good)}
#impinfo{display:flex;flex-direction:column;gap:4px}
.impsum{font-size:13.5px;color:var(--ink)}
.impx{display:flex;flex-direction:column;gap:6px;margin-top:6px;padding:10px;border-radius:12px;background:var(--surface-2)}
.impx-h{font-size:12px;color:var(--muted)}
.impx-row{display:grid;grid-template-columns:20px minmax(0,7.5em) minmax(0,1fr);gap:8px;align-items:center}
.impx-row b{font-family:var(--f-word);font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.impx-row input[type=checkbox]{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.impx-m{padding:6px 10px}
/* === A: home & decks === */
/* home hero: what is left of today's goal, side by side; the number is red only while reviews are due */
.bignum.due.zero b{color:var(--faint)}
.today-note{font-size:12px;color:var(--muted);margin-top:-8px}
/* 出題のしかた (the sheet behind the home card's 「変える ›」): 復習 [4択｜カード] with a line on what it means, 出題, 1セット */
/* the counts never break inside a word */
.nw{white-space:nowrap}
.goal-line .ib{display:inline-block}   /* 「基礎を一周」 never splits as 「を一 / 周」 */
/* first run: the logo beside the title, a short lead, the curve kept small; the start buttons stay in view */
.ob-hd{display:flex;align-items:center;justify-content:center;gap:10px}
.ob-hd .ob-logo{width:40px;height:40px;border-radius:11px;font-size:22px}
.ob-lead{text-align:center;font-size:13.5px;color:var(--muted);line-height:1.7}
.ob-lead b{display:block;color:var(--ink)}
.sheet:has(.ob){max-height:calc(100% - 28px - env(safe-area-inset-top,0px))}   /* the welcome takes nearly the whole screen, so both choices sit above the start buttons */
.ob .fchart{max-height:110px}
.ob .fchart text{font-size:13px}   /* held to 110px tall (scale ~0.92), so 13 viewBox units ~ 12px on screen */
.ob-opt{min-height:46px;padding:8px 12px;flex-wrap:wrap;column-gap:10px;row-gap:0}
.ob-opt small{margin-left:auto;text-align:right}
.ob-chip span{display:flex;flex-direction:column;align-items:center;line-height:1.25}
.ob-chip small{font-size:12px;font-weight:400;color:var(--muted)}
.ob-more>summary{min-height:44px;display:flex;align-items:center;font-size:13.5px;font-weight:700;color:var(--accent);list-style:none;cursor:pointer}
.ob-more>summary::-webkit-details-marker{display:none}
.ob-more>summary::after{content:"";margin-left:8px;width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg)}
.ob-more[open]>summary::after{transform:translateY(2px) rotate(-135deg)}
.ob-more .ob-opt+.ob-opt{margin-top:6px}
.ob-go{position:sticky;bottom:0;z-index:1;margin:2px -18px -22px;padding:12px 18px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);box-shadow:0 -12px 16px -14px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:8px}
.ob-go .btn-big{flex-direction:column;gap:0;line-height:1.3}   /* the label on one line, 最大50語 under it (side by side both broke: 始め／る) */
.ob-go .btn-big small{margin-left:0}
.ob-links{display:flex;justify-content:center;gap:20px}
.ob-links .link{min-height:44px;padding:0 4px}
/* deck page: search first, the chips in one row that scrolls sideways, a key for the dots */
.chips.filter{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-block:4px;margin-block:-4px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent)}
.chips.filter::-webkit-scrollbar{display:none}
.chips.filter .chip{flex:none;white-space:nowrap}
.legend i.wdot{width:8px;height:8px;border-radius:50%}
.wsn{margin-left:6px;font-family:var(--f-ui);font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
@media (max-width:360px){   /* 320px: the word gets the row's width, its meaning (and the 赤シート band) under it */
  .wrow{grid-template-columns:10px minmax(0,1fr) auto;row-gap:3px}
  .wrow .wdot{grid-row:1 / span 2} .wrow .wmean{grid-column:2;grid-row:2;justify-self:start} .wrow .wdue{grid-column:3;grid-row:1 / span 2}
}
/* card sheet: the reset is a small text button, away from 出題しない (it can be undone from the notice) */
.reset-link{align-self:center;min-height:40px;font-size:13.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
/* settings: a segmented control under its label spans the row */
.frow.wrap>.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;width:100%}
.frow.wrap>.seg button{padding:9px 4px}
.pat .pg{margin-left:.5em;font-family:var(--f-ui);font-weight:400;font-size:.86em;color:var(--muted)}
/* 表紙 (deckCover): the top card of a ring-bound 単語カード stack, a second card peeking out behind it. 72×96 on a shelf,
   92×120 as the hero (cv-hero), 44×58 in a list (cv-sm). The hole shows what it sits on: --holebg (the page; a card's surface inside one) */
.cover{--cw:72px;--chh:96px;--cv:var(--cv-my);--holebg:var(--bg);position:relative;display:block;width:var(--cw);height:var(--chh);flex:none;color:#fff}
.tcard .cover,.sheet .cover{--holebg:var(--surface)}
.cover::before{content:"";position:absolute;inset:0;border-radius:calc(var(--cw) * .07) calc(var(--cw) * .16) calc(var(--cw) * .16) calc(var(--cw) * .07);background:color-mix(in srgb,var(--cv) 28%,var(--surface));transform:translate(calc(var(--cw) * .05),calc(var(--cw) * .04)) rotate(3.2deg);transform-origin:20% 90%}
.cover.on::after{content:"";position:absolute;inset:-6px -7px -6px -6px;border-radius:calc(var(--cw) * .12) calc(var(--cw) * .22) calc(var(--cw) * .22) calc(var(--cw) * .12);box-shadow:0 0 0 2.5px var(--accent);pointer-events:none}   /* 使っている */
.mekuru{display:block;flex:none;pointer-events:none;user-select:none}
.hero-mk.wig,.k-mk-btn .mekuru.wig{animation:mkwig var(--dur-3) var(--ease-io)}   /* a tap: めくる turns its head, once */
@keyframes mkwig{40%{transform:rotate(-8deg) translateY(-2px)}}
@keyframes mkin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.today-nums.steps{align-items:start}
.today-nums.steps em{align-self:flex-start;margin-top:5px;font-style:normal;font-size:12px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:1px 8px}
.bignum.later b{color:var(--faint)}
.bignum.done b{color:var(--good)}
.bignum.done b .ico{width:40px;height:40px;stroke-width:3}
.bignum.done span{color:var(--good-t)}
.parent-line{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:13.5px}
.parent-line .pl-k{font-size:12px;font-weight:700;color:var(--muted)}
.parent-line b{font-family:var(--f-word);font-size:15px}
.parent-line .pl-m{color:var(--ink)}
.kana{display:block;margin-top:2px;font-size:13.5px;color:var(--muted);letter-spacing:.02em}
.kana b,.fb-word .kana b{color:var(--ink);font-weight:700;font-size:inherit;font-family:inherit;letter-spacing:inherit}
.back-pron{text-align:center;margin:-4px 0 10px}
.ask-p{margin:4px 0 14px;font-size:15px;line-height:1.7}
/* ===== ホーム: 今日の学習 — a short road ① 復習 → ② 新しい単語 → ゴール. The punched hole and its ring sit in the corner, so the
   road has the card's full width; one main button (復習する, then 覚える) with an edge under it ===== */
.today{margin-top:10px;padding:16px 16px 0}
.th{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px 10px;padding-left:24px;min-height:44px}   /* too long for one line (big counts, big text): the right side goes under, never on top */
.th-t{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.th-t small{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.th-big{margin-top:3px;font-size:15px;font-weight:700;white-space:nowrap}
.th-big b{font-size:30px;line-height:1;letter-spacing:-.01em;margin:0 2px}
.th-big.hit{font-size:22px;color:var(--streak-t);letter-spacing:.02em}
.th-side{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;padding-bottom:1px;font-size:12px;font-weight:700;color:var(--muted);line-height:1.35;white-space:nowrap}
.th-side b{font-size:18px;color:var(--ink);line-height:1.1}
.th-none{margin:10px 0 14px 24px;font-size:13.5px;color:var(--muted)}
.today > .btn-main{margin-bottom:18px}
/* under the head: the finish line 「12月28日に基礎を一周」 (a tap: 1日の目標), or how far the deck is */
.today .goal-line{display:flex;align-items:center;gap:6px;width:calc(100% - 24px);min-height:44px;margin:0 0 -8px 24px;font-size:12px;color:var(--muted);text-align:left}
.today .goal-line .ico{width:15px;height:15px;flex:none;color:var(--faint)}
.today .goal-line > span{flex:1;min-width:0}
.today .goal-line b{color:var(--ink)}
.today .goal-line.nd .ico{color:var(--good)}
.path{list-style:none;margin:14px 0 0;padding:0}
.step{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr);column-gap:12px;padding-bottom:16px}
.step::before{content:"";position:absolute;left:19px;top:46px;bottom:6px;width:2px;border-radius:2px;background:var(--line)}
.step.goal::before{content:none}
.step.done::before{background:color-mix(in srgb,var(--good) 55%,var(--line))}
.node{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:700;color:var(--muted);background:var(--surface);border:2px solid var(--line)}
.node .ico{width:20px;height:20px;stroke-width:3}
.step.now .node{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 5px var(--accent-soft)}
.step.done .node{background:var(--good);border-color:var(--good);color:var(--surface)}
.step.skip .node{border-style:dashed;color:var(--faint)}
.sb{min-width:0}
.sh{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 8px;min-height:40px;padding-top:5px}
.sh > b{font-size:18px;line-height:1.5;letter-spacing:.02em}
.step.done .sh > b,.step.skip .sh > b{font-size:15px;color:var(--muted)}
.sn{font-size:12px;color:var(--muted);white-space:nowrap}
.sn b{font-size:18px;line-height:1;color:var(--ink);margin-right:1px}
.nonet{font-size:13.5px;font-weight:700;color:var(--muted)}
.st-tag{font-style:normal;font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap}
.step .sub{margin-top:-4px;font-size:12px;line-height:1.45;color:var(--muted);word-break:auto-phrase;overflow-wrap:anywhere}
.step .sub b{color:var(--ink)}
.step .sub.sd,.step .sub .sd{color:var(--good-t);font-weight:700}
.sb > .btn-main{margin-top:4px}
.sb > .btn-main ~ .sub{margin-top:8px}
.sb.two{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:10px}
.sbtns{display:flex;flex-direction:column;gap:6px}   /* ① after the goal: 続ける over おさらい */
.nd-go{margin-top:8px}
/* the main button and the quieter one beside it: a bottom edge, pressed down on tap */
.btn-main{width:100%;min-height:54px;margin-bottom:4px;font-size:18px;letter-spacing:.02em;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-edge)}
.btn-main .ico{width:15px;height:15px;fill:currentColor;stroke:none}
.btn-main:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-edge)}
.btn-sub{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--ghost-edge);margin-bottom:3px}
.btn-sub:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ghost-edge)}
.btn-sub.sm{min-height:44px;padding:0 16px;border-radius:12px;font-size:15px;white-space:nowrap}
/* ゴール: 連続 N日 → N+1日, めくる waits at the end of the road (a tap: it talks); reached, a warm band */
.step.goal{align-items:center;padding-bottom:14px}
.step.goal .node{border:2px dashed color-mix(in srgb,var(--streak) 70%,transparent);background:var(--streak-soft);color:var(--streak)}
.step.goal .node .ico{width:21px;height:21px;stroke-width:1.9}
.step.goal .sb{display:flex;flex-direction:column;align-items:flex-start;line-height:1.3}
.step.goal .sb small{font-size:12px;font-weight:700;color:var(--muted)}
.gl{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;margin-top:3px;font-size:15px;font-weight:700}
.dpill{display:inline-flex;align-items:baseline;gap:1px;padding:1px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.dpill b{font-size:15px;color:var(--ink)}
.dpill.lit{background:var(--streak-soft);border-color:color-mix(in srgb,var(--streak) 45%,transparent);color:var(--streak-t)}
.dpill.lit b{color:var(--streak-t)}
.gl .arrow{color:var(--faint);font-size:13.5px}
.gsub{margin-top:2px;font-size:12px;color:var(--muted)}
.step.goal.hit{margin:6px -8px 12px;padding:10px 8px;border-radius:16px;background:var(--streak-soft)}
.step.goal.hit .node{border:2px solid var(--streak);background:var(--streak);color:#fff}
.step.goal.hit .node .ico{fill:currentColor}
.step.goal.hit .gl{font-size:22px;color:var(--streak-t)}
.today .hero-mk{width:84px;height:84px}
/* what めくる says when tapped: beside it, over the goal line (never over a button; taps go through); やったね！ on the band sits above it */
.mkbubble{position:absolute;right:82px;bottom:2px;z-index:3;max-width:calc(100% - 134px);padding:6px 11px;border-radius:14px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);font-size:13.5px;font-weight:700;line-height:1.5;pointer-events:none}
.mkbubble::after{content:"";position:absolute;right:-7px;bottom:14px;width:11px;height:11px;background:var(--surface);border-top:1.5px solid var(--line);border-right:1.5px solid var(--line);transform:rotate(45deg)}
.step.goal.hit .mkbubble:not([data-tap]){right:6px;bottom:calc(50% + 34px);max-width:calc(100% - 52px)}
.step.goal.hit .mkbubble:not([data-tap])::after{right:32px;bottom:-7px;border-top:0;border-bottom:1.5px solid var(--line)}
.mkbubble.pop{animation:mkin var(--dur-2) var(--ease-out) both}
/* past the goal: more new words, saying which; then how reviews are asked, one quiet line (opens 出題のしかた) */
/* the decks in use: 表紙, name, 学習ずみ %, where you are, one bar; a tap opens the deck */
/* ほかの練習: compact rows, only the ones that can start */
.mkbubble{word-break:auto-phrase;overflow-wrap:anywhere}
/* a count (語・分・日・問・%) in Literata, the words' face, as on 記録 and the results; its unit small and regular. A date or a
   number inside a sentence keeps the UI face */
.th-big b,.th-side b,.sn b,.dpill b,.pill.streak .num,.dk-dots b,.xn,.np b,.gl .gn,.dtabs small.num,.ch > b,.stepper output{font-family:var(--f-num);font-weight:600;font-variant-numeric:lining-nums tabular-nums}
.th-side > span,.dpill,.np,.pill.streak,.ch > b small{font-weight:400}
.np b{font-size:13.5px;margin-right:1px}
.gl .gn{margin:0}
.pill.streak .num{font-size:15px}
/* the streak pill once today's goal is reached: warm, as the goal band */
.pill.streak.done{background:var(--streak-soft);border-color:color-mix(in srgb,var(--streak) 45%,transparent);color:var(--streak-t)}
.pill.streak.done .ico{fill:var(--streak)}
/* a narrow phone (320–360px): a smaller road, so 「新しい単語 15語」 and 「連続 4日 → 5日」 stay on one line */
@media (max-width:360px){
  .step{grid-template-columns:36px minmax(0,1fr);column-gap:10px}
  .node{width:36px;height:36px}
  .step::before{left:17px;top:42px}
  .sh{min-height:36px;padding-top:3px;gap:0 6px}
  .sh > b{font-size:15px}
  .sn b{font-size:18px}
  .btn-sub.sm{padding:0 11px}
  .th-big b{font-size:30px}
  .th-side b{font-size:18px}
  .th-big.hit{font-size:18px;letter-spacing:0}   /* 「目標達成」 beside 「今日やった 28語を 10分で」 at 320px */
  .today .hero-mk{width:72px;height:72px}
  .gl{gap:4px}
  .dpill{padding:1px 7px}
  .mkbubble{right:70px;max-width:calc(100% - 116px)}
}
/* sheet */
.backdrop{position:fixed;inset:0;z-index:60;background:rgba(10,14,22,.42);animation:fade var(--dur-1) var(--ease-out)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:90%;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18);padding-bottom:env(safe-area-inset-bottom,0px);animation:up var(--dur-2) var(--ease-out);overscroll-behavior:contain}
.sheet-in{max-width:560px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:10px 22px;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.sheet-h{display:flex;align-items:center;gap:8px}
.sheet-h h3{font-size:18px;flex:1}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--surface-2);border-radius:10px;padding:9px 10px;display:flex;flex-direction:column;min-width:0}
.kv span{font-size:12px;color:var(--muted);font-weight:700}
.kv b{font-size:15px;font-variant-numeric:tabular-nums}
.ai-box{background:var(--surface-2);border-radius:12px;padding:12px 14px;white-space:pre-wrap;font-size:13.5px;line-height:1.7;border:1px solid var(--line)}
.memo{background:var(--marker);color:#2b2508;border-radius:10px;padding:10px 12px;white-space:pre-wrap;font-size:13.5px}
.cardview{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:24px 16px 18px}
.plist{display:flex;flex-direction:column;max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.plist label{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:9px 12px;border-top:1px solid var(--line);align-items:start}
.plist label:first-child{border-top:0}
.plist b{font-family:var(--f-word)}
.confirm{background:var(--again-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--kb,0px) + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:700;max-width:calc(100% - 32px);animation:rise var(--dur-2) var(--ease-out)}
#app:has(.ctadock) ~ #toastroot .toast{bottom:calc(132px + var(--kb,0px) + env(safe-area-inset-bottom,0px))}   /* a page with a bottom dock (home, deck page): above its button (58 + 10 + 54 = 122px), not on it */
/* while studying or sorting, notices sit over the header row (between × and 1問もどす), clear of the timer bar, the speed label and the answers;
   one without a button lets taps through; their button is a full-height tap target */
#screen:not([hidden]) ~ #toastroot .toast{top:calc(8px + env(safe-area-inset-top,0px));bottom:auto;max-width:calc(100% - 112px);font-size:13.5px;line-height:1.4}
#screen:not([hidden]) ~ #toastroot .toast:not(:has(.toast-btn)){pointer-events:none}
.toast-btn{min-height:44px;margin:-10px -16px -10px 0;padding:0 14px;border-radius:0 12px 12px 0;background:color-mix(in srgb,var(--bg) 16%,transparent)}
.toast{animation-name:toastin;width:max-content}   /* its own width, centred (left:50% alone would cap it at half the screen) */
@keyframes toastin{from{transform:translate(-50%,6px);opacity:.4}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.btn-row .btn{white-space:nowrap;padding:0 10px}
.btn small{font-weight:400;font-size:12px;opacity:.85}
@media (max-width:400px){
  .tcard.holed::before{left:12px;top:14px}
  .ring{left:5px}
  .qcard.leave{transform-origin:19.5px 21.5px}   /* the hole's centre */
  .bignum b{font-size:30px}
  .btn-row .btn{font-size:13.5px;gap:6px}
}
@media (max-width:350px){.btn-row{grid-template-columns:1fr}}
/* 320px results: two rows of buttons, each on one line */
/* === C: tokens & base === */
/* state colours as text: dark enough on white and on their own soft fills (bars, borders and fills keep --again / --hard / --good) */
.g1{color:var(--again-t)} .g2{color:var(--hard-t)} .g3{color:var(--good-t)}
.grade small{opacity:1}
.sw-no,.fb.ng .fb-head,.cmp-row.ng s,.qask b{color:var(--again-t)}
.swlab.l{color:var(--again-t);border-color:var(--again-t)}
.btn-danger,.mk.x,.spell-note{color:var(--again-t)}
.mk.o,.rate.t2{color:var(--good-t)}
.rate.t1,.syncbtn.warn .synclab{color:var(--hard-t)}
.swn{opacity:1}
.choice.ok .key,.choice.ng .key{color:var(--surface);font-family:var(--f-ui);font-size:13.5px;line-height:1}   /* the ○ / × on its filled key: white in light mode, dark in dark mode */
.sheetbtn[aria-pressed="true"]{background:color-mix(in srgb,var(--sheet) 88%,#000);border-color:transparent}
.memo{color:var(--memo-ink)}
.syncbtn.login .synclab{color:var(--accent)}
/* Japanese labels: 12px at least, everywhere (the scale's first step) */
.cmp-l,.wd small,.qundo.col,.qtype{font-size:12px}
.grade small.jp,.ftag,.fchip .pos{font-size:12px}
.fchart text{font-size:11.5px}   /* viewBox units: about 12px on a phone */
/* running text, a sentence or more: a little more open than a label */
.small,.nudge span,.frow .lab span,.stk-rule,.ety,.ins p,.hw p,.bs-note{line-height:1.7;word-break:auto-phrase}
.legend,.syncbtn,.kv span{font-size:12px}
/* the dock rises when it first appears, not on every redraw of the same page */
.ctadock.still{animation:none}
/* tap areas about 44px, the look unchanged */
.iconbtn,.qundo,.say,.pill.streak,.back{position:relative}
.iconbtn::after{content:"";position:absolute;inset:-2px}
.qundo::after{content:"";position:absolute;inset:-5px -2px}
.say::after{content:"";position:absolute;inset:-5px}
.pill.streak::after{content:"";position:absolute;inset:-8px -4px}
/* .seg clips its buttons, so these grow for real */
.seg button,.seg-sm button{min-height:40px}
.stepper button,.stepper-sm button{width:40px;height:40px}
.chip{min-height:36px;padding:7px 12px}
.chips{gap:8px}
.back{padding:11px 0}
.sec-h .link{padding:12px 4px;margin:-12px -4px}   /* a taller target, the header row keeps its height */
/* no double-tap zoom on any page (pinch zoom still works); .swarea's touch-action:none still narrows it */
html{touch-action:manipulation}
/* a settings row flips its switch wherever it is tapped */
.frow:has(.switch){cursor:pointer;-webkit-user-select:none;user-select:none}
/* sheets: pulled down by the grab bar or the header to close; they sit on the on-screen keyboard (--kb, set from visualViewport) */
.sheet{bottom:var(--kb,0px);max-height:calc(90% - var(--kb,0px))}
.sheet.drag{transition:none;animation:none;-webkit-user-select:none;user-select:none}
.grab,.sheet-h{touch-action:none}
.grab{position:relative}
.grab::after{content:"";position:absolute;inset:-14px -60px}
.sheet form .btn-primary[type=submit],#impgo{position:sticky;bottom:8px;z-index:1}
/* === めくるの一言 (first run): めくる and one short line, the first time a thing matters. A tap on it or anywhere closes it
   (a tap on an answer button only closes it). On a study card it sits at the card's foot, above the buttons === */
.tut{display:flex;align-items:flex-end;gap:2px;text-align:left;animation:mkin var(--dur-2) var(--ease-out) both}
.tut .mekuru{width:54px;height:54px;margin-bottom:-4px}
.tut .tb{position:relative;flex:0 1 auto;min-width:0;margin:0 0 12px;padding:8px 12px;border-radius:16px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);font-size:13.5px;font-weight:700;line-height:1.6;word-break:auto-phrase;overflow-wrap:anywhere;cursor:pointer}
.tut .tb::before{content:"";position:absolute;left:-7px;bottom:12px;width:11px;height:11px;background:inherit;border:solid var(--line);border-width:0 0 1.5px 1.5px;transform:rotate(45deg)}
.qstage > .tut{position:absolute;left:6px;right:6px;bottom:8px;z-index:5}
@media (max-width:340px){.qstage > .tut .tb{padding:7px 10px;font-size:12px}.qstage > .tut .mekuru{width:46px;height:46px}}   /* 320px: 「知らなかったら[もう一度]でOK。」 on one line */
.swfoot > .tut{margin:-4px 0 0}
.qstage > .tut.top{top:-4px;bottom:auto;align-items:flex-start}   /* about the bar: at the card's top, the tail up at 「今なら Perfect」 (the word stays in view) */
.tut.top .mekuru{margin:2px 0 0}
.tut.top .tb{margin:12px 0 0}
.tut.top .tb::before{left:auto;right:30px;top:-7px;bottom:auto;border-width:1.5px 0 0 1.5px}
.tut.up{display:block;margin:-4px 0 14px}   /* home: under the thing it is about, the tail pointing up at it (めくる at the goal) */
.tut.up .tb{margin:0}
.tut.up .tb::before{left:auto;right:34px;top:-7px;bottom:auto;border-width:1.5px 0 0 1.5px}
.tut.in{flex-direction:row-reverse;margin:12px -4px 0 0}   /* beside a button: めくる on the right */
.tut.in .tb::before{left:auto;right:-7px;border-width:1.5px 1.5px 0 0}
.tut.still .tb{cursor:auto}
.tb .ts{display:inline-block}
/* a button's name in a line, in the button's own colour */
.tk{display:inline-block;margin:0 2px;padding:0 6px;border-radius:6px;font-size:13.5px;line-height:1.65;white-space:nowrap}
.tk.g1,.tk.no{background:var(--again-soft);color:var(--again-t)} .tk.g2{background:var(--hard-soft);color:var(--hard-t)} .tk.g3{background:var(--good-soft);color:var(--good-t)}
.tk.g4,.tk.yes{background:var(--easy-soft);color:var(--easy)} .tk.st{background:var(--streak-soft);color:var(--streak-t)}

/* a set of new words only: what you said about each, not a score — 「N語 めくった」 in the four colours, the words by when they come back */

.flg li.z{color:var(--faint)}
.mk .ico{width:14px;height:14px;stroke-width:2.4}

/* === 辞書, the 単語帳 tab's search box: under the title, part of the page (it scrolls away with the shelves); while results
   are shown it stays at the top as they scroll. Focused and empty: 最近しらべた単語 drops down over the shelves (nothing under
   the finger moves). A row like the deck list's; an entry looks like the card sheet, its two buttons held at the sheet's foot === */
.dsearch{position:relative;z-index:5;margin:4px -16px 0;padding:8px 16px;background:var(--bg)}
.dsearch.on{position:sticky;top:0}

.dentry .qpos{flex-wrap:wrap;justify-content:center}
.dst{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.dst.learn{color:var(--accent)} .dst.master{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.dst.weak{background:var(--again-soft);border-color:transparent;color:var(--again-t)}
.dpar{display:inline-flex;align-items:baseline;flex-wrap:wrap;justify-content:center;align-content:center;gap:0 2px;min-height:44px;padding:4px 10px;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--accent)}

.dpar span{color:var(--muted)}
.dgrp{width:100%;margin-top:6px;text-align:left}

.dgrp-h{display:flex;flex-wrap:wrap;gap:2px 12px;padding:0 8px;font-size:12px;font-weight:700;color:var(--muted)}
.dgrp-h i{display:inline-block;width:9px;height:9px;margin-right:5px;border-radius:2px;background:var(--cv)}
.dgrp .senses{margin-top:4px}
.dplaces{display:flex;flex-direction:column;gap:6px}
.dplace{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:7px 10px 7px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left}
.dplace .cover{--cw:30px;--chh:40px;margin:2px 2px 0 0}
.dplace > span:not(.cover){flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.4}
.dplace b{font-size:15px} .dplace small{font-size:12px;color:var(--muted)}
.dplace > .ico{width:16px;height:16px;color:var(--faint)}
.sheet:has(.dacts){padding-bottom:0}   /* the button bar holds the home-indicator inset itself (it would float above it) */
.dacts{position:sticky;bottom:0;z-index:2;display:flex;gap:8px;margin:0 -18px -22px;padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);box-shadow:0 -12px 16px -14px rgba(0,0,0,.35)}

.sheet:has(.cardview),.sheet:has(.cardview) .dacts{background:var(--bg)}   /* not a white card in a white sheet: one paper card on the desk */
.sheet:has(.cardview) .cover{--holebg:var(--bg)}
.dacts .btn.add{flex-grow:1.5}
.btn-weak{background:var(--again-soft);color:var(--again-t)}
.sheet-h .sp{flex:1}
.dback{gap:4px;min-height:44px;font-size:15px}
.dback b{font-family:var(--f-word);font-size:15px;font-weight:600;color:var(--ink)}
.bs-note{margin:-4px 0 0;font-size:12px;color:var(--muted);line-height:1.5}
@media (max-width:360px){.dacts .btn{font-size:13.5px;padding:0 8px}.dacts .btn .ico{display:none}}
@media (max-width:374px){.dm-x{display:none}.dsearch input::placeholder{font-size:13.5px}}   /* narrower than 375 (320 too): Weblio ↗ ／ 英辞郎 ↗ side by side, the form in view; the box's placeholder whole */
/* ===== 新デザイン: 上のバー, ホーム（E/notes.md の §3。値は 375px のもの） ===== */

.k-top-r{display:flex;align-items:center;gap:6px;min-width:0}
.k-hit{height:44px;display:flex;align-items:center;flex:none}

.k-ring{width:26px;height:26px;flex:none;position:relative}

.k-avatar{width:44px;justify-content:center;margin-right:-4px;position:relative}
.k-face{width:36px;height:36px;border-radius:50%;background:var(--blue-tint);color:var(--blue);display:grid;place-items:center;font-size:var(--fs-body);font-weight:800;overflow:hidden}

.k-avatar .syncdot{display:none;position:absolute;right:3px;bottom:5px;width:10px;height:10px;box-shadow:0 0 0 2px var(--bg)}

@media (max-width:350px){.k-pill{gap:5px;padding-right:10px}.k-sep{margin:0 1px}}   /* 320px: 連続365日 ｜ お休み2枚 still in one pill */
/* the home: no column gutter of its own (the shelves run edge to edge); each part keeps --pad */

.k-sec{margin-top:var(--sec-gap)}
.k-first{margin-top:12px}
.k-sec-h{display:flex;align-items:center;padding:0 max(var(--pad),env(safe-area-inset-left,0px));margin-bottom:4px;min-height:44px}
.k-sec-h.has-sub{flex-direction:column;align-items:flex-start;justify-content:center;margin-bottom:10px}
.k-sec-h.has-sub .k-sec-t > button{min-height:28px}   /* the heading and its line share one 44px+ row */
.k-sec-t{display:flex;align-items:center;gap:2px;margin:0;font-size:var(--fs-sec);font-weight:800;letter-spacing:.01em;line-height:1.25;font-feature-settings:"palt"}
.k-sec-t > button{display:flex;align-items:center;gap:2px;min-height:44px;font-weight:inherit;text-align:left}
.k-sec-t svg{width:20px;height:20px;flex:none;margin-top:1px;color:var(--ink-3);fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.k-sec-s{font-size:var(--fs-sub);color:var(--ink-2);line-height:1.35;font-feature-settings:"palt"}
.k-ph{display:inline-block}
/* ヒーロー: what the button starts sets its cover and its colour (2 decks or more: the covers stacked, app blue) */
.k-hero{--hero-bg:var(--blue-hero);margin:0 max(var(--pad),env(safe-area-inset-left,0px));background:var(--hero-bg);color:var(--on-blue);border-radius:var(--r-hero);padding:18px}
.k-hero.book-kiso{--hero-bg:var(--h-kiso)} .k-hero.book-hyojun{--hero-bg:var(--h-hyojun)} .k-hero.book-hatten{--hero-bg:var(--h-hatten)}
.k-hero.book-juku{--hero-bg:var(--h-juku)} .k-hero.book-tagi{--hero-bg:var(--h-tagi)} .k-hero.book-theme{--hero-bg:var(--h-theme)}
.k-hero.book-chu{--hero-bg:var(--h-chu)} .k-hero.book-my{--hero-bg:var(--h-my)}
.k-hero-top{display:flex;gap:16px;align-items:center}
.k-hero-top .k-cover{box-shadow:var(--sh-book-on-hero)}
.k-stack{position:relative;width:98px;height:86px;flex:none}
.k-stack .k-cover{position:absolute;top:0}
.k-stack .back{left:0} .k-stack .front{left:34px}
.k-hero-txt{min-width:0}
.k-hero-title{display:flex;align-items:baseline;flex-wrap:wrap;margin:0;font-weight:800;line-height:1;font-feature-settings:"palt"}
.k-hero-title .pre{font-size:var(--fs-hero-pre);margin-right:3px}
.k-hero-title .n{font-family:"Figtree",var(--f-ui);font-size:var(--fs-hero-num);letter-spacing:-.01em}
.k-hero-title .unit{font-size:var(--fs-hero-unit);margin-left:2px}
.k-hero-title .post{font-size:var(--fs-hero-unit);margin-left:8px}
.k-hero-title .big{font-size:24px;line-height:1.2}
.k-hero-sub{font-size:var(--fs-body);font-weight:500;color:rgba(255,255,255,.88);margin-top:8px;font-feature-settings:"palt"}
.k-hero-streak{margin-top:2px;display:flex;align-items:center;gap:3px}
.k-hero-streak svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round}
.k-hero-streak.lit svg{color:var(--orange)}
.k-hero-title + .k-hero-streak{margin-top:8px}
.k-hero-streak + .k-hero-sub{margin-top:2px}
.k-seg{margin-top:20px}
.k-seg-bar,.k-seg-lab{display:grid;column-gap:3px}
.k-seg-bar{height:8px}
.k-seg-bar i{display:block;border-radius:var(--r-bar)}
.k-seg-bar .done{background:#fff} .k-seg-bar .rev{background:rgba(255,255,255,.46)} .k-seg-bar .new{background:rgba(255,255,255,.22)}
.k-seg-lab{margin-top:8px;font-size:var(--fs-sub);font-weight:700;font-feature-settings:"palt"}

.k-seg-lab .done{color:#fff} .k-seg-lab .rev{color:rgba(255,255,255,.86)} .k-seg-lab .new{color:rgba(255,255,255,.76)}
.k-seg-lab.split{display:flex;justify-content:space-between}
.k-hero-act{display:flex;gap:10px;margin-top:18px}
.k-play{flex:1;min-width:0;min-height:60px;border-radius:var(--r-pill);background:#fff;color:#121216;display:flex;align-items:center;gap:10px;padding:9px 14px 9px 18px;text-align:left;transition:transform .08s var(--ease-io)}

.k-play-t{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.k-play-main{font-size:var(--fs-cta);font-weight:800;font-feature-settings:"palt"}
.k-play-sub{font-size:var(--fs-min);font-weight:500;color:#5E5E68;font-feature-settings:"palt"}
.k-play-sub .ln{display:block}
.k-more{width:60px;height:60px;flex:none;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center}

.k-sub-act{width:100%;min-height:48px;margin-top:10px;border-radius:var(--r-pill);background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px 0 20px;font-size:var(--fs-body);font-weight:700;text-align:left;font-feature-settings:"palt"}

.k-hero-none{margin-top:10px;font-size:var(--fs-body);color:rgba(255,255,255,.88)}
/* 棚: a row of covers that scrolls sideways, the last one always cut at the edge */
.k-shelf{display:flex;align-items:flex-start;gap:var(--shelf-gap);overflow-x:auto;padding:0 max(var(--pad),env(safe-area-inset-left,0px));scroll-snap-type:x mandatory;scroll-padding:0 var(--pad);scrollbar-width:none;overscroll-behavior-x:contain}

.k-cover{--w:64px;--h:86px;--top:7px;--left:10px;--kj-top:21px;--kj:38px;--obi:20px;position:relative;flex:none;display:block;width:var(--w);height:var(--h);border-radius:var(--r-book);background:var(--bk);box-shadow:var(--sh-book);color:#fff;overflow:hidden;text-align:left}

.k-cover.paper{background:var(--paper);color:var(--paper-ink);box-shadow:var(--sh-book),inset 0 0 0 1px rgba(18,18,22,.05)}

.k-cover.paper .obi{background:var(--bk)}

.k-cover.s-shelf{--w:88px;--h:118px;--top:9px;--left:14px;--kj-top:27px;--kj:var(--fs-kj-book);--obi:26px}

.study.v2 .grade.g1{--gt:var(--ng-tint);--gi:var(--ng-ink)} .study.v2 .grade.g2{--gt:var(--hd-tint);--gi:var(--hd-ink)} .study.v2 .grade.g3{--gt:var(--ok-tint);--gi:var(--ok-ink)} .study.v2 .grade.g4{--gt:var(--blue-tint);--gi:var(--blue)}
.study.v2 .grade:active{transform:scale(.97);background:color-mix(in srgb,var(--gi) 12%,var(--gt))}
.study.v2 .grade b{font-size:var(--fs-name);font-weight:800;line-height:1.3;white-space:nowrap;letter-spacing:-.01em}
.study.v2 .grade small,.study.v2 .grade small.jp{margin:0;font-family:var(--f-ui);font-size:var(--fs-sub);font-weight:500;line-height:1.3;color:var(--gi);opacity:1}
.study.v2 .grade b{color:var(--gi)}
.study.v2 .grade-note{font-size:var(--fs-min);color:var(--ink-2)}
/* a short screen (iPhone SE, 文字「大」): tighter, so わからない stays in view */
.short .study.v2 .qhead{margin-top:14px}
.short .study.v2 .choice{min-height:52px}
.short .study.v2 .choices{gap:8px}
.short .study.v2 .qcard.flashc{margin-top:10px}
.short .study.v2 .grade{min-height:64px}
/* ---- the sheet: white, from below, its top 78px left over a dimmed screen (the steps stay bright above the scrim; taps still reach
   × and 1問もどす). A miss: the whole height, 次へ fixed at the foot, the rest scrolls ---- */
.fb-scrim{position:fixed;inset:0;z-index:44;background:var(--scrim);pointer-events:none;animation:fade var(--dur-2) var(--ease-out)}
.fb.v2{top:auto;max-height:calc(100% - 78px - env(safe-area-inset-top,0px));border:0;border-radius:var(--r-hero) var(--r-hero) 0 0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);box-shadow:0 -8px 30px rgba(18,18,22,.14);padding-bottom:0;word-break:auto-phrase}
.fb.v2.ng{top:calc(78px + env(safe-area-inset-top,0px))}
.fb.v2.ng,.fb.v2.near{box-shadow:none}
.fb.v2:has(#fbmore:not([hidden])){max-height:calc(100% - 78px - env(safe-area-inset-top,0px))}
.fb.v2.near,.fb.v2.near:has(#fbmore:not([hidden])){bottom:var(--kb,0px);max-height:calc(100% - 78px - env(safe-area-inset-top,0px) - var(--kb,0px))}
.fb.v2 .fb-in{flex:1 1 auto;min-height:0;max-width:560px;gap:0;padding:0 0 calc(22px + env(safe-area-inset-bottom,0px))}
.fb.v2 .grab{display:block;flex:none;width:36px;height:5px;margin:7px auto 0;border-radius:3px;background:var(--grab)}
.fb.v2 .fb-sc{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;padding:10px max(20px,env(safe-area-inset-right,0px)) 2px max(20px,env(safe-area-inset-left,0px))}
.fb.v2 .fb-body{min-height:auto;overflow:visible;gap:0}
.fb.v2 .fb-actions{flex:none;padding:10px max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px))}
.fb.v2 .fb-actions > .btn{width:100%;min-height:56px}
/* 1. the verdict: a 28 circle (× red / ✓ green), 不正解 21/800; on the right ↻ 3問あとにもう一度 (words only) */
.fb.v2 .fb-head{display:flex;flex-wrap:nowrap;align-items:center;gap:9px;min-height:36px;color:var(--ink);font-size:var(--fs-sec);font-weight:800}
.fb.v2.ok .fb-head,.fb.v2.ng .fb-head,.fb.v2.near .fb-head{color:var(--ink)}
.fb.v2 .fb-tt{display:inline-flex;align-items:center;gap:9px;letter-spacing:.01em;font-feature-settings:"palt"}
.fb.v2 .mk{width:28px;height:28px;margin:0;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff;font-size:15px;font-weight:800}
.fb.v2 .mk.x{background:var(--ng)} .fb.v2 .mk.o{background:var(--ok)} .fb.v2 .mk.n{background:var(--hard);color:#fff}
.fb.v2 .mk svg{width:16px;height:16px}
.fb.v2 .fb-head .rate{height:26px;display:inline-flex;align-items:center;margin-left:2px;padding:0 10px;border-radius:var(--r-pill);background:var(--ok-solid);color:#fff;font-family:var(--f-en);font-size:var(--fs-sub);font-weight:800}
.fb.v2 .ivl{display:inline-flex;align-items:center;gap:4px;padding:0;background:none;font-family:var(--f-ui);font-size:var(--fs-sub);font-weight:700;color:var(--ink-2);white-space:nowrap;font-feature-settings:"palt"}
.fb.v2 .ivl svg{width:16px;height:16px;flex:none}
.fb.v2 .fb-more{height:44px;margin:0 -4px 0 0;padding:0 4px 0 8px;border:0;border-radius:0;font-size:var(--fs-sub);font-weight:700;color:var(--blue)}
/* 2. the word: 26/700, 🔊, the 帯 and No.; the reading under it */
.fb.v2 .fb-word{display:block;margin-top:12px}
.fb.v2 .e-line{display:flex;flex-wrap:wrap;align-items:center;gap:0 6px;min-width:0}
.fb.v2 .e-word{min-width:0;font-family:var(--f-en);font-size:var(--fs-entry);font-weight:700;line-height:1.15;letter-spacing:-.005em;overflow-wrap:break-word}
.fb.v2 .e-word.len-l{font-size:22px}
.fb.v2 .no{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none;font-family:var(--f-en);font-size:var(--fs-sub);font-weight:700;color:var(--ink-2);white-space:nowrap}
.fb.v2 .e-pron{margin-top:2px;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px}
.fb.v2 .e-pron .kana{margin:0}
.fb.v2 .e-pron:empty{display:none}
/* 3. 正解 in green, the strongest text on the sheet; 4. your answer one step smaller, struck through, whose meaning it was, 押し間違えた */
.fb.v2 .cmp{margin-top:14px;display:flex;flex-direction:column;gap:8px;padding:0;border-radius:0;background:none}
.fb.v2 .cmp-row{display:block;border-radius:var(--r-card);font-size:var(--fs-body);line-height:1.4}
.fb.v2 .cmp-l{display:block;width:auto;font-size:var(--fs-min);font-weight:700;line-height:1.3;font-feature-settings:"palt"}
.fb.v2 .cmp-row.ok{padding:13px 14px 14px;background:var(--ok-tint)}
.fb.v2 .cmp-row.ok .cmp-l{color:var(--ok-ink)}
.fb.v2 .cmp-t{margin-top:5px;display:flex;align-items:center;gap:8px;font-size:var(--fs-answer);line-height:1.3;font-feature-settings:"palt"}
.fb.v2 .cmp-t b{font-weight:800;color:var(--ink)}
.fb.v2 .cmp-t.en b{font-family:var(--f-en);font-weight:700}
.fb.v2 .cmp-row.ok .pos{width:22px;min-width:22px;height:22px;background:var(--bg);font-size:var(--fs-min)}
.fb.v2 .cmp-row.ok small{display:block;margin-top:2px;font-size:var(--fs-min);color:var(--ink-2)}
.fb.v2 .cmp-row.ng{display:flex;align-items:center;gap:8px;padding:9px 6px 10px 14px;background:var(--ng-tint)}
.fb.v2 .cmp-a{flex:1;min-width:0;display:flex;flex-direction:column}
.fb.v2 .cmp-row.ng .cmp-l{color:var(--ng-ink)}
.fb.v2 .cmp-row.ng s{margin-top:2px;font-size:var(--fs-body);font-weight:500;color:var(--ink-2);text-decoration-thickness:1.5px;text-decoration-color:color-mix(in srgb,var(--ink-2) 65%,transparent)}
.fb.v2 .cmp-row.ng s.en{font-family:var(--f-en)}
.fb.v2 .cmp-row.ng small{margin-top:1px;font-size:var(--fs-min);color:var(--ink-2)}
.fb.v2 .cmp-row.ng small b{font-family:var(--f-en);font-weight:700;color:var(--ink)}
.fb.v2 .cmp-dk{margin-top:2px;font-size:var(--fs-body);font-weight:500;color:var(--ink-2)}
.fb.v2 .cmp-undo{flex:none;height:44px;min-height:0;margin:0;padding:0 8px;font-size:var(--fs-sub);font-weight:700;color:var(--blue);text-decoration:none;white-space:nowrap}
.fb.v2 .cmp .cw{display:block;font-family:var(--f-en);font-size:22px;font-weight:700;letter-spacing:.02em;color:var(--ink)}
.fb.v2 .cmp-row.ok .cw{margin-top:5px}
.fb.v2 .cmp-row.ng .cw{margin-top:2px;font-size:18px;font-weight:500}
/* 5. that meaning's example: the word marked in the same pale green as the 正解 box */
.fb.v2 .fb-exrow{margin-top:14px;display:flex;align-items:flex-start;gap:4px}
.fb.v2 .ex-t{flex:1;min-width:0;padding-top:2px}
.fb.v2 .fb-ex{font-family:var(--f-en);font-size:var(--fs-name);font-weight:500;line-height:1.4;color:var(--ink)}
.fb.v2 .fb-exrow .fb-ex .mark{background:var(--ok-tint)}
.fb.v2 .fb-ja{margin-top:3px;font-size:var(--fs-sub);line-height:1.5;color:var(--ink-2)}
.fb.v2 .fb-exrow .sayex{position:relative;width:44px;height:44px;flex:none;margin:-4px -4px 0 0;display:grid;place-items:center;background:none;vertical-align:0}
.fb.v2 .fb-exrow .sayex::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--fill)}
.fb.v2 .fb-exrow .sayex::after{content:none}
.fb.v2 .fb-exrow .sayex svg{position:relative;width:18px;height:18px}
/* 6. the table: a 78px label column, a thin line over each row; a row you press is 48 high, its action blue with › */
.fb.v2 .facts{margin-top:12px}
.fb.v2 .f-row{display:grid;grid-template-columns:78px minmax(0,1fr);align-items:baseline;column-gap:8px;padding:12px 0;border-top:1px solid var(--hair)}
.fb.v2 .f-k{font-size:var(--fs-sub);font-weight:700;color:var(--ink-2);font-feature-settings:"palt"}
.fb.v2 .f-v{min-width:0;font-size:var(--fs-body);line-height:1.45;font-feature-settings:"palt"}
.fb.v2 .f-v b{font-weight:700}
.fb.v2 .f-sub{display:block;margin-top:1px;font-size:var(--fs-sub);color:var(--ink-2)}
.fb.v2 .f-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px}
.fb.v2 .f-line + .f-line{margin-top:6px}
.fb.v2 .f-line + b{display:block;margin-top:8px}
.fb.v2 .f-line .pos,.fb.v2 .fchip .pos{width:22px;min-width:22px;height:22px;font-size:var(--fs-min);align-self:center}
.fb.v2 .f-en{font-family:var(--f-en);font-weight:600}
.fb.v2 .pat{display:inline;margin-left:6px;font-family:var(--f-en);font-size:var(--fs-sub);font-weight:600;color:var(--ink-2)}
.fb.v2 .morph{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.fb.v2 .m{display:inline-flex;align-items:center;gap:4px;min-height:28px;padding:0 8px;border-radius:var(--r-set);background:var(--fill)}
.fb.v2 .m b{font-family:var(--f-en);font-size:var(--fs-body);font-weight:700}
.fb.v2 .m span{font-family:"Noto Sans JP",sans-serif;font-size:var(--fs-min);color:var(--ink-2)}
.fb.v2 .plus{padding:0 1px;font-size:var(--fs-min);color:var(--ink-3)}
.fb.v2 .f-row.fam{display:grid;align-items:start;gap:0 8px;margin:0;padding:0}
.fb.v2 .f-row.fam .f-k{padding-top:15px}
.fb.v2 .fchips{display:flex;flex-direction:column;gap:0}
.fb.v2 .fchip{display:flex;align-items:center;gap:7px;width:100%;min-height:48px;padding:0;border:0;border-radius:0;background:none;text-align:left}
.fb.v2 .fchip + .fchip{border-top:1px solid var(--hair)}
.fb.v2 .fchip::after{content:none}
.fb.v2 .fchip b.en{font-family:var(--f-en);font-size:var(--fs-name);font-weight:700}
.fb.v2 .fchip .go{margin-left:auto;display:flex;align-items:center;font-size:var(--fs-sub);font-weight:700;color:var(--blue);white-space:nowrap}
.fb.v2 .fchip .go svg{width:17px;height:17px}
.fb.v2 .fchip.on .go{visibility:hidden}
.fb.v2 .fdetail:not(:empty){margin:0 0 12px;padding:10px 12px;border-radius:var(--r-card);background:var(--fill)}
.fb.v2 .fdetail .fw{font-family:var(--f-en);font-weight:700}
.fb.v2 .fdetail .sm{font-weight:700}
.fb.v2 .fdetail .sex{margin-top:4px;font-family:var(--f-en);font-size:var(--fs-body)}
.fb.v2 .fdetail .sja{font-size:var(--fs-sub);color:var(--ink-2)}
.fb.v2 .fdetail .mark{background:var(--bg)}
/* a right answer's sheet (スペル, 語法, a new meaning, or 自動で次へ off): the meaning, then 詳しく */
.fb.v2 .fb-body > *{margin-top:10px}
.fb.v2 .fb-mean{font-size:var(--fs-answer);font-weight:800;line-height:1.35;font-feature-settings:"palt"}
.fb.v2 .fb-mean .muted{font-size:var(--fs-body);font-weight:500;color:var(--ink-2)}
.fb.v2 .tease,.fb.v2 .sprog,.fb.v2 .ety,.fb.v2 .senses li.locked{font-size:var(--fs-sub);color:var(--ink-2)}
.fb.v2 .ety .ep{font-family:var(--f-en);color:var(--ink)}
.fb.v2 .senses li{padding:6px 0}
.fb.v2 .senses .sm,.fb.v2 .senses li.hit .sm{margin:0;padding:0;background:none;color:var(--ink);font-size:var(--fs-name);font-weight:700}
.fb.v2 .senses .sex{font-family:var(--f-en);font-size:var(--fs-body)}
.fb.v2 .senses .sja{font-size:var(--fs-sub);color:var(--ink-2)}
.fb.v2 .usenote .fb-ex b{color:var(--ok-ink)}
.fb.v2 .usenote .why{font-size:var(--fs-sub)}
/* おしい: the right spelling typed once more */
.fb.v2 .retype{width:100%}
.fb.v2 .retype input{height:56px;border-radius:var(--r-card);border:1.5px solid var(--line-card);background:var(--bg);font-family:var(--f-en);font-size:20px;font-weight:600}
.fb.v2 .retype input:focus{border-color:var(--blue)}
.fb.v2 .retype input.ng{border-color:var(--ng);background:var(--ng-tint)}
.fb.v2 .retype .btn{min-height:56px;padding:0 22px}
/* ===== 結果画面（S/result/notes.md）: .screen-in.res.v2. The top bar is the study screen's (without 9/12); the hero is the home's,
   always blue (the score is its star: a book's red or green would read as × or ○); the rest is rows of small grey names over bold
   figures, no boxes. Its own parts start with rs- ===== */
.res.v2{padding-bottom:calc(34px + env(safe-area-inset-bottom,0px));word-break:auto-phrase}
.res.v2 button{font-feature-settings:"palt"}
.res.v2.dock-on{padding-bottom:calc(98px + env(safe-area-inset-bottom,0px))}
.res.v2 .k-hero{margin:0}
.res.v2 .k-sec-h,.res.v2 .k-say{padding-left:0;padding-right:0}
.rs-first{margin-top:12px}
.rs-cele + .rs-first,.rs-notice + .rs-first{margin-top:22px}
.k-hero-title .unit.pct{font-family:"Figtree",var(--f-ui)}
.rs-hero .k-hero-sub + .k-hero-sub{margin-top:2px}
.rs-hero .k-sub-act + .k-sub-act{margin-top:8px}
.rs-say,.rs-inst{margin-top:22px}
.rs-sec{margin-top:var(--sec-gap)}
.res.v2 .k-sec-h.has-sub{margin-bottom:6px}
/* the numbers (Strava's row): 3 columns, a grey name, a bold Figtree figure with a small unit */
.rs-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:12px;margin-top:26px}
.rs-stats .l{margin:0;font-size:var(--fs-sub);color:var(--ink-2);white-space:nowrap;font-feature-settings:"palt"}
.rs-stats .v{margin:3px 0 0;font-size:var(--fs-body);font-weight:700;line-height:1.1;white-space:nowrap;font-feature-settings:"palt"}
.rs-stats .v b{font-family:"Figtree",var(--f-ui);font-size:var(--fs-stat);font-weight:800;letter-spacing:-.01em;margin-right:1px}
/* the answers' speed: the same name over figure, in equal columns; a 0 in grey */
.rs-spd{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr))}
.rs-spd .k{margin:0;font-size:var(--fs-sub);color:var(--ink-2);white-space:nowrap;font-feature-settings:"palt"}
.rs-spd .n{margin:3px 0 0;font-family:"Figtree",var(--f-ui);font-size:var(--fs-stat);font-weight:800;line-height:1.1;letter-spacing:-.01em}
.rs-spd .n.zero{color:var(--ink-2)}
/* the words: ○ / × (the study screen's colours), the word as asked (tend to do), its other meanings as a tag, when it comes back, › */
.rs-wl{margin:0;padding:0;list-style:none}
.rs-wl.rest{margin-top:12px}
.rs-wr{width:100%;display:flex;align-items:center;gap:12px;padding:0;text-align:left;color:var(--ink)}
.rs-mk{width:24px;height:24px;flex:none}
.rs-mk.ok{color:var(--ok)} .rs-mk.ng{color:var(--ng)}
.rs-mk.redo{display:grid;place-items:center;color:var(--ink-2)} .rs-mk.redo svg{width:22px;height:22px}
.rs-wr .b{flex:1;min-width:0;min-height:66px;display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--hair)}
.rs-wl li:first-child .b{border-top:0}
.rs-wr .t{flex:1;min-width:0}
.rs-wr .w{display:flex;flex-wrap:wrap;align-items:center;column-gap:8px;row-gap:4px;font-family:var(--f-en);font-size:17px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.rs-wr .w i{font-style:italic;font-weight:600;color:var(--ink-2)}
.rs-wr .tag{font-family:var(--f-ui);font-size:var(--fs-min);font-weight:700;color:var(--ink-2);background:var(--fill);border-radius:var(--r-pill);padding:2px 8px 1px;white-space:nowrap;line-height:1.45;font-feature-settings:"palt"}
.rs-wr .m{display:block;margin-top:2px;font-size:var(--fs-body);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-feature-settings:"palt"}
.rs-wr .nx{flex:none;display:flex;align-items:center;font-size:var(--fs-sub);font-weight:700;color:var(--ink-2);white-space:nowrap;font-feature-settings:"palt"}
.rs-wr .nx svg{width:18px;height:18px;color:var(--ink-3);margin-right:-5px}
/* 練習 (a row button with its time) and ホームへ */
.rs-row{width:100%;min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0;border-top:1px solid var(--hair);font-size:var(--fs-body);font-weight:700;color:var(--blue);text-align:left}
.rs-row .r{display:flex;align-items:center;gap:2px;flex:none;font-weight:500;color:var(--ink-2)}
.rs-row svg{width:18px;height:18px;color:var(--blue);margin-right:-5px}
.rs-home{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;border-radius:var(--r-pill);background:var(--fill);color:var(--ink);font-size:var(--fs-name);font-weight:700;text-align:center}
.rs-row:active,.rs-home:active,.rs-wr:active .b{opacity:.7}
/* the goal reached: the top bar pill's ring, closed and large (88), the streak at the hero's figure size, the week */
.rs-cele{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:10px}
.rs-ring{width:88px;height:88px}
.rs-cele-t{display:flex;align-items:baseline;justify-content:center;margin:14px 0 0;font-weight:800;line-height:1;font-feature-settings:"palt"}
.rs-cele-t .pre{font-size:var(--fs-hero-pre);margin-right:3px}
.rs-cele-t .num{font-family:"Figtree",var(--f-ui);font-size:var(--fs-hero-num);letter-spacing:-.01em}
.rs-cele-t .unit{font-size:var(--fs-hero-unit);margin-left:2px}
.rs-cele-s{margin:8px 0 0;font-size:var(--fs-body);color:var(--ink-2);font-feature-settings:"palt"}
.rs-cele-s + .rs-cele-s{margin-top:2px}
.rs-week{display:flex;gap:12px;margin:16px 0 0;padding:0;list-style:none}
.rs-week li{display:flex;flex-direction:column;align-items:center;gap:5px;width:30px}
.rs-week .d{font-size:var(--fs-min);font-weight:700;color:var(--ink-2);line-height:1.2;white-space:nowrap;font-feature-settings:"palt"}
.rs-week .dot{width:30px;height:30px;border-radius:50%;background:var(--fill);color:var(--ink-3);display:grid;place-items:center}
.rs-week .dot svg{width:18px;height:18px}
.rs-week .on .dot{background:var(--orange-track);color:var(--orange)}
.rs-week .fz .dot{background:var(--blue-tint);color:var(--blue)}
.rs-week .now .d{color:var(--ink)}
.rs-week .now .dot{background:var(--orange);color:#fff}
/* its moves (about 1.2 s; the hero's button works from the start): the ring closes from where today stood before the set, the
   flame pops, the streak turns over, today's dot lights up. The end state is the plain style above; 動きを減らす shows only that */
.rs-ring .arc{stroke-dashoffset:0;animation:rs-ring .6s cubic-bezier(.2,.7,.3,1) both}
.rs-ring .flame{transform-box:fill-box;transform-origin:center;animation:rs-pop .25s ease-out .6s both}
.rs-tick{position:relative;display:inline-block;clip-path:inset(0 -8px)}
.rs-tick .old{position:absolute;left:0;top:0;opacity:0;animation:rs-out .3s ease-in .8s both}
.rs-tick .new{display:inline-block;animation:rs-in .3s ease-out .8s both}
.rs-week .now .dot{animation:rs-lit .2s ease-out 1s both}
.rs-week .now .dot svg{animation:rs-pop .2s ease-out 1s both}
@keyframes rs-ring{from{stroke-dashoffset:var(--from,59.69)}to{stroke-dashoffset:0}}
@keyframes rs-pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes rs-out{from{transform:translateY(0);opacity:1}to{transform:translateY(-100%);opacity:0}}
@keyframes rs-in{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
@keyframes rs-lit{from{background:var(--orange-track)}to{background:var(--orange)}}
@media (prefers-reduced-motion:reduce){.rs-cele *{animation:none!important}}
/* 今日の分の復習 完了: one quiet grey line (it comes every day) */

.rs-notice .t{margin:0;font-size:var(--fs-body);font-weight:700;line-height:1.35;font-feature-settings:"palt"}
.rs-notice .s{margin:1px 0 0;font-size:var(--fs-sub);color:var(--ink-2);line-height:1.35;font-feature-settings:"palt"}
/* the dock: the hero's button again once it has gone off the top (as the home's tab bar: 82 high, the bottom 22 the home bar's) */
.rs-dock{position:fixed;left:0;right:0;bottom:0;z-index:42;min-height:82px;background:var(--tabbar-bg);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--hair);display:flex;align-items:center;padding:0 max(var(--pad),env(safe-area-inset-right,0px)) max(22px,env(safe-area-inset-bottom,0px)) max(var(--pad),env(safe-area-inset-left,0px));transform:translateY(100%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s}
.rs-dock.on{transform:none;visibility:visible;transition:transform .22s ease}
.rs-dock-btn{flex:1;max-width:528px;margin:0 auto;min-height:48px;border-radius:var(--r-pill);background:var(--blue-hero);color:var(--on-blue);display:flex;align-items:center;gap:8px;padding:0 18px 0 16px;text-align:left}
.rs-dock-btn svg{width:20px;height:20px;flex:none;fill:currentColor}
.rs-dock-btn .t{flex:1;min-width:0;font-size:var(--fs-name);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs-dock-btn .r{flex:none;font-size:var(--fs-sub);font-weight:500;color:rgba(255,255,255,.88)}
/* a word's sheet: the study screen's miss sheet inside the usual sheet (white, its corners, its grab) */
.sheet:has(> .sheet-in > .rs-sheet){background:var(--bg);border-radius:var(--r-hero) var(--r-hero) 0 0;padding-bottom:0}
.sheet-in:has(> .rs-sheet){padding:0;gap:0}
.sheet-in:has(> .rs-sheet) > .grab{flex:none;width:36px;height:5px;margin:7px auto 0;border-radius:3px;background:var(--grab)}
.fb.v2.rs-sheet{position:static;inset:auto;z-index:auto;max-height:none;min-height:0;box-shadow:none;background:none;animation:none}
.fb.v2.rs-sheet .fb-in{padding-bottom:0}
.fb.v2.rs-sheet .fb-sc{padding-top:6px;overflow:visible}
.fb.v2.rs-sheet .fb-actions{position:sticky;bottom:0;background:var(--bg);padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
.fb.v2.rs-sheet .cmp-row.ok small{display:block;margin-top:2px;font-size:var(--fs-min);color:var(--ink-2)}
.fb.v2 .mk.r{background:var(--fill);color:var(--ink-2)}
@media (max-width:350px){
  .rs-stats{column-gap:8px}
  .rs-stats .l,.rs-spd .k{font-size:var(--fs-min)}
  .rs-stats .v b,.rs-spd .n{font-size:22px}
  .rs-week{gap:8px}
}
@media (max-width:350px){
  .study.v2 .qundo span,.res.v2 .qundo span,.sw.v2 .qundo span{padding:0 10px 0 8px}
  .study.v2 .grade b{font-size:var(--fs-body)}
  .study.v2 .grade small,.study.v2 .grade small.jp{font-size:var(--fs-min)}
  .fb.v2 .f-row{grid-template-columns:70px minmax(0,1fr)}
}
/* ===== 新デザイン5: 記録タブ（S/stats/notes.md。値は 375px のもの）=====
   #view.v2.kst: the title, the three numbers, 連続記録 (the big ring, the month, the お休みチケット), 覚えた単語 (the stacked bar, meanings and

.k-pst .l{font-size:var(--fs-sub);color:var(--ink-2);margin-top:1px;font-feature-settings:"palt"}

   the bar is the app blue on the bars' track (as every progress bar); no new colour, no badge: the 級 is a word */
.k-xbar{display:block;height:8px;border-radius:var(--r-bar);background:var(--track);overflow:hidden}

.k-kyu-s{margin:6px 0 0;font-size:var(--fs-sub);color:var(--ink-2);line-height:1.45;font-feature-settings:"palt"}
/* ===== 極み道場（docs/features/dojo.md）: a deck's dojo at the very bottom of its page, 極 at the top of the 単語帳 tab. A card of 墨
   with the dojo's 看板 (a plank of paper, its 帯 in the deck's colour, the name in brush) and, once passed, a red 合格 seal. Its own
   parts start with k-dj (the card, the list sheet) and dj- (the test and its results) ===== */
:root{--dj-bg:#1C1B20;--dj-seal:#E5483F;--dj-kw:linear-gradient(90deg,var(--c-kiso) 0 20%,var(--c-hyojun) 20% 40%,var(--c-hatten) 40% 60%,var(--c-juku) 60% 80%,var(--c-tagi) 80%)}   /* 極's 帯: the 5 decks' colours side by side */
.k-dj{position:relative;margin:26px max(var(--pad),env(safe-area-inset-right,0px)) 0 max(var(--pad),env(safe-area-inset-left,0px))}
.k-dj.kw{margin-top:14px}
.k-dj-card{position:relative;overflow:hidden;border-radius:var(--r-card);background:var(--dj-bg);color:#fff;padding:16px 16px 16px}
:root[data-theme="dark"] .k-dj-card{box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .k-dj-card{box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)} }
.k-dj-top{display:flex;gap:14px;align-items:flex-start}
.k-dj-sign{position:relative;flex:none;width:40px;height:108px;border-radius:2px;background:var(--paper);color:#121216;display:flex;justify-content:center;padding-top:15px;overflow:hidden}
.k-dj-sign::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--bk,var(--ink-2))}
.k-dj-sign.kw::before{background:var(--dj-kw)}
.k-dj-sign span{writing-mode:vertical-rl;font-family:var(--f-cover);font-size:19px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.k-dj-sign.l5 span{font-size:16px}
.k-dj-sign.q{background:var(--fill);color:var(--ink-3)} .k-dj-sign.q::before{background:var(--track)}
.k-dj-txt{flex:1;min-width:0;padding-top:1px}
.k-dj.passed .k-dj-txt{padding-right:52px}
.k-dj-t{margin:0;font-size:var(--fs-sec);font-weight:800;line-height:1.25;font-feature-settings:"palt"}
.k-dj-s{margin:6px 0 0;font-size:var(--fs-sub);color:rgba(255,255,255,.78);line-height:1.5;font-feature-settings:"palt"}
.k-dj-st{margin:8px 0 0;display:flex;flex-wrap:wrap;gap:0 10px;font-size:var(--fs-sub);font-weight:700;line-height:1.5;font-feature-settings:"palt"}
.k-dj-st .b{font-weight:500;color:rgba(255,255,255,.78)}
.k-seal{position:relative;display:grid;place-items:center;width:52px;height:52px;flex:none;border-radius:50%;border:2.5px solid var(--dj-seal);color:var(--dj-seal);font-family:var(--f-cover);font-size:16px;line-height:1;letter-spacing:.02em;rotate:-12deg}   /* rotate, not transform: the pop and the stamp scale it without undoing the tilt */
.k-seal::after{content:"";position:absolute;inset:3px;border-radius:50%;border:1px solid var(--dj-seal);opacity:.55}
.k-dj-card .k-seal{position:absolute;top:14px;right:14px}
.k-dj-act{margin-top:16px;display:flex}
.k-dj-act .k-play{--hero-bg:var(--bk,var(--dj-bg))}
.k-dj-act .k-play.kw > svg{color:var(--dj-bg)}
.k-dj-wait{flex:1;min-height:48px;display:flex;align-items:center;gap:8px;padding:6px 16px;border-radius:var(--r-pill);background:rgba(255,255,255,.10);font-size:var(--fs-body);font-weight:700;line-height:1.35;color:rgba(255,255,255,.86);font-feature-settings:"palt"}
.k-dj-wait svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.k-dj .k-say{padding:0;margin-top:12px}
/* the first time: the card waits unseen (data-new, then data-hold while the reveal plays over the page); the reveal's 看板 flies into
   the card's and the card opens out around it with a thud, a light runs over it, paper bits fly, めくる says so. 動きを減らす: it only
   fades in (by script; every CSS animation is off then) */
.k-dj[data-new] .k-dj-card,.k-dj[data-new] .k-say,.k-dj[data-hold] .k-dj-card,.k-dj[data-hold] .k-say{opacity:0}
.k-dj-fx{position:absolute;left:calc(-1 * max(var(--pad),env(safe-area-inset-left,0px)));right:calc(-1 * max(var(--pad),env(safe-area-inset-right,0px)));top:-150px;height:340px;overflow:hidden;pointer-events:none;z-index:2}   /* the page's width: the bits never make it scroll sideways */
.k-dj-fx i{position:absolute;left:calc(50% - 3px);top:185px;width:6px;height:10px;border-radius:1px;background:var(--c,#fff);opacity:0}
@media (prefers-reduced-motion: no-preference){

  .k-dj.rise .k-dj-sign{animation:dj-thud .32s ease-out var(--dt,0s) both}
  .k-dj.rise .k-dj-card::after{content:"";position:absolute;top:0;bottom:0;left:0;width:46%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.26),transparent);transform:translateX(-120%) skewX(-12deg);animation:dj-sweep .75s ease-in-out calc(var(--dt,0s) + .2s) both;pointer-events:none}
  .k-dj.rise .k-dj-fx i{animation:dj-bit 1.15s cubic-bezier(.15,.7,.35,1) calc(var(--dt,0s) + .06s + var(--d,0s)) both}
  .k-dj.rise .k-say{animation:mkin .3s var(--ease-out) calc(var(--dt,0s) + .55s) both}
  .k-dj.rise .k-seal{animation:rs-pop .4s var(--ease-out) calc(var(--dt,0s) + .4s) both}
}
@keyframes dj-land{0%{opacity:0;transform:scale(.9)}30%{opacity:1}62%{transform:scale(1.015)}100%{opacity:1;transform:none}}
@keyframes dj-thud{0%{transform:none}35%{transform:translateY(2px) scaleY(.96)}100%{transform:none}}
@keyframes dj-sweep{to{transform:translateX(330%) skewX(-12deg)}}
@keyframes dj-bit{0%{opacity:1;transform:translate(0,0) rotate(0) scale(.6)}45%{opacity:1;transform:translate(calc(var(--x) * .7),var(--y)) rotate(calc(var(--r) * .5)) scale(1)}100%{opacity:0;transform:translate(var(--x),calc(var(--y) + 70px)) rotate(var(--r)) scale(1)}}   /* up, then falling away */
/* the reveal (djFx), over everything (the toasts too): the screen goes 墨, a light leaks through a seam as the drum rolls, the 看板
   slams down (an ink splash in the deck's colour, light rays, a shock ring, one soft flash, gold sparks and paper on a canvas), the brush
   line, then the 看板 flies into the card. Every move is the Web Animations API (one clock: a tap ends it at any moment, and the docs'
   pictures stop it anywhere); 動きを減らす: it only fades in and out */
.k-djx{position:fixed;inset:0;z-index:96;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;cursor:pointer;-webkit-tap-highlight-color:transparent;color:#fff}
.k-djx-bg{position:absolute;inset:0;background:radial-gradient(110% 70% at 50% 40%,#2B2931 0%,var(--dj-bg) 48%,#0B0A0D 100%);opacity:0}
.k-djx-st,.k-djx-fx{position:absolute;inset:0}
.k-djx canvas{position:absolute;inset:0;width:100%;height:100%}
.k-djx-c{position:absolute;left:50%;top:40%;width:0;height:0;scale:var(--k,1)}   /* the point it all comes out of: the 看板's middle (smaller on a short screen) */
.k-djx-c > *{position:absolute}
.k-djx-rays{left:-80vmax;top:-80vmax;width:160vmax;height:160vmax;opacity:0}
.k-djx-rays i{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from 4deg,rgba(255,226,170,0) 0deg 8deg,rgba(255,226,170,.17) 10.5deg 12.5deg,rgba(255,226,170,0) 15deg 22.5deg);-webkit-mask:radial-gradient(closest-side,#000 6%,rgba(0,0,0,.55) 30%,transparent var(--rl,62%));mask:radial-gradient(closest-side,#000 6%,rgba(0,0,0,.55) 30%,transparent var(--rl,62%))}
.k-djx-rays i + i{background:repeating-conic-gradient(from 0deg,rgba(255,240,215,0) 0deg 5deg,rgba(255,240,215,.10) 6deg 7deg,rgba(255,240,215,0) 8deg 15deg)}
.k-djx.kw .k-djx-rays{--rl:92%}
.k-djx.kw .k-djx-rays i{background:repeating-conic-gradient(from 4deg,rgba(255,206,110,0) 0deg 7deg,rgba(255,206,110,.24) 10deg 12.5deg,rgba(255,206,110,0) 15.5deg 22.5deg)}
.k-djx.kw .k-djx-rays i + i{background:repeating-conic-gradient(from 0deg,rgba(255,232,180,0) 0deg 4.5deg,rgba(255,232,180,.13) 6deg 7.5deg,rgba(255,232,180,0) 9deg 15deg)}
.k-djx-glow{left:-190px;top:-190px;width:380px;height:380px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,216,150,.5),rgba(255,190,100,.16) 55%,rgba(255,190,100,0));opacity:0}
.k-djx.kw .k-djx-glow{left:-260px;top:-260px;width:520px;height:520px;background:radial-gradient(closest-side,rgba(255,206,110,.62),rgba(255,180,70,.2) 55%,rgba(255,180,70,0))}
.k-djx-ink{left:-170px;top:-170px;width:340px;height:340px;opacity:0;overflow:visible}
.k-djx-ring{left:-70px;top:-70px;width:140px;height:140px;border-radius:50%;border:2px solid rgba(255,228,176,.85);box-shadow:0 0 18px rgba(255,210,140,.5),inset 0 0 18px rgba(255,210,140,.35);opacity:0}
.k-djx-slit{left:-1.5px;top:-34vh;width:3px;height:68vh;border-radius:2px;background:linear-gradient(rgba(255,236,200,0),#FFF6E4 32%,#FFF6E4 68%,rgba(255,236,200,0));box-shadow:0 0 22px 5px rgba(255,214,150,.55);opacity:0}
.k-djx-fly{left:-44px;top:-119px;width:88px;height:238px}
.k-djx .k-dj-sign{width:88px;height:238px;padding-top:33px;border-radius:4px;box-shadow:0 18px 50px rgba(0,0,0,.55)}   /* the card's 看板 ×2.2, so it flies into it */
.k-djx .k-dj-sign::before{height:18px}
.k-djx .k-dj-sign span{font-size:42px}
.k-djx .k-dj-sign.l5 span{font-size:35px}
.k-djx-txt{position:absolute;left:0;right:0;top:calc(40% + 150px * var(--k,1));padding:0 16px;text-align:center}
.k-djx-t{margin:0;font-family:var(--f-cover);font-size:clamp(26px,8.6vw,40px);font-weight:400;line-height:1.2;letter-spacing:.02em;white-space:nowrap;text-shadow:0 0 22px rgba(255,206,130,.45),0 2px 0 rgba(0,0,0,.4)}

function filterCards(d){
  const q = route.q.trim().toLowerCase(), blk = route.sec != null ? deckSections(d)[route.sec] : null;
  return (route.filter === 'deriv' ? d.dcards : q ? [...d.cards, ...d.dcards] : d.cards).filter(c => {   // a search finds derivatives too (decision)
    const p = prog(c), s = status(p);
    if (blk && !blk.all.has(c)) return false;
    if (route.filter === 'new' && s !== 'new') return false;
    if (route.filter === 'learn' && s !== 'learn') return false;
    if (route.filter === 'master' && s !== 'master') return false;
    if (route.filter === 'leech' && !isLeech(p)) return false;
    if (route.filter === 'recent' && !missedLast(p)) return false;
    if (route.filter === 'sus' && !p?.sus) return false;
    if (route.cat && (c.cat || c.parent?.cat) !== route.cat) return false;
    if (q && !(c.w.toLowerCase().includes(q) || c.s.some(s => s.m.includes(q)) || (!c.isD && String(c.n) === q))) return false;
    return true;
  });
}
