/* one badge against the records: ok, and how far it is (left, in its unit) */
function achTest(b, x){
  if (b.cat === 'streak') return {ok: x.st.best >= b.n, left: Math.max(1, b.n - x.st.n)};
  if (b.cat === 'days') return {ok: x.days >= b.n, left: Math.max(1, b.n - x.days)};
  if (b.cat === 'ans') return {ok: x.ans >= b.n, left: Math.max(1, b.n - x.ans)};
  if (b.cat === 'master') return {ok: x.mAll >= b.n, left: Math.max(1, b.n - x.mAll)};
  if (b.cat === 'book') { const k = x.books[b.deck]; return {ok: !!k && k.total > 0 && k.left <= 0, left: k ? Math.max(1, k.left) : 0}; }
  if (b.cat === 'pf') return {ok: x.pf >= b.n, left: Math.max(1, b.n - x.pf)};
  if (b.cat === 'run') return {ok: x.run.b >= b.n, left: Math.max(1, b.n - x.run.n)};   // あと: from the run now

    case 'x_300': return {ok: x.d300};

  catch:'caught', lose:'lost', leave:'left', pay:'paid', hear:'heard', tell:'told', feel:'felt', mean:'meant', see:'saw|seen',
  do:'did|done|does', have:'has|had', lead:'led', bear:'bore|borne|born', draw:'drew|drawn', throw:'threw|thrown', wear:'wore|worn',
  write:'wrote|written', speak:'spoke|spoken', grow:'grew|grown', know:'knew|known', show:'shown', lay:'laid', lie:'lay|lain',

/* 知ってる is checked by a 4択 later and counts as 覚えた only once that is right. The day comes from the word's key, so a big

const swCheck = p => isReview(p) && !!p.k && (p.r || 0) === 1;   // not answered since it was sorted as 知ってる

function splitCSV(line){
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) { const ch = line[i];
    if (q) { if (ch === '"' && line[i+1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
    else if (ch === '"') q = true; else if (ch === ',') { out.push(cur); cur = ''; } else cur += ch; }
  out.push(cur); return out;
}
function parseImport(text){
  const clean = s => String(s||'').replace(/<br\s*\/?>/gi,' ').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').trim();
  const out = [];
  for (const raw of text.replace(/\r/g,'').split('\n')) {
    const line = raw.trim(); if (!line || line.startsWith('#')) continue;
    const f = (line.includes('\t') ? line.split('\t') : splitCSV(line)).map(clean);
    if (f.length < 2) continue;
    let w, p = '', m, e = '', j = '';
    if (POS.includes(f[1]) && f.length >= 3) [w, p, m, e = '', j = ''] = f; else [w, m, e = '', j = ''] = f;
    if (!w || !m) continue;
    const s = parseSenseText(m, p); if (!s.length) continue;

}

/* ---------- 英単語を貼るだけ ---------- */
/* One English word per line, as iPhone Live Text copies a printed list (numbers, bullets and a Japanese meaning after it are
   fine). A word the app has becomes a reference to its card; any other word can be added with a meaning (typed now or later)
   or left out. Lines in the 「英単語, 意味, 例文, 例文の訳」 form keep their own meaning, as before. */
let IMP = {on: new Map(), mean: new Map(), file: '', last: null};
const JA = /[\u3040-\u30ff\u3400-\u9fff]/;
const JA_AT = /[\u3040-\u30fa\u30fc-\u30ff\u3400-\u9fff]|[～〜(（][\u3040-\u30fa\u30fc-\u30ff\u3400-\u9fff]/;
const LIST_MARK = /^(?:\s*(?:no\.?\s*)?[\d０-９]+\s*[.．):）：\]、,，-]?|[\s・•●○◎◯■□☐✓✔*#>\-–—\u2460-\u2473])+\s*/i;   // 12. ／ No.3 ／ ① ／ ・
/* "12. abandon ～を捨てる" → {w:'abandon', m:'～を捨てる'} */
function wordLine(s){
  s = String(s || '').replace(LIST_MARK, ''); const at = s.search(JA_AT);
  const m = at >= 0 ? s.slice(at).trim() : '';

    .replace(/^\s*(?:no\.?\s*)?\d+\s*[.):\]、,-]?\s*/i, '').replace(/^[\s・•●○◎◯■□☐✓✔*#>\-–—]+/, '')
    .replace(/\s+(?:v|vt|vi|n|adj|adv|prep|conj)\.(?=\s|$)/gi, ' ').replace(/[\s:;=,.\-–—]+$/, '').replace(/\s+/g, ' ').trim();
  if (!/^[a-z][a-z' .~()\/-]*$/i.test(w) || w.split(' ').length > 6) return null;

  if (w.endsWith('s') && !w.endsWith('ss')) out.push(w.slice(0, -1));
  if (w.endsWith('ed')) out.push(w.slice(0, -2), w.slice(0, -1), ...(w.at(-3) === w.at(-4) ? [w.slice(0, -3)] : []));   // stopped -> stop; warned is not war

/* the built-in card for a pasted word: as written, then without ~ / A / one's, then a plain base form (-s -es -ies -ed -ing).

function findBuiltin(w){
  const idx = wordIndex(), k = normW(w);
  let cands = idx.get(k) || (k.includes(' ') ? idx.get(looseW(k)) : null);
  if (!cands && /^[a-z]+$/.test(k)) for (const b of baseForms(k)) if ((cands = idx.get(b))) break;
  if (!cands) return null;
  const score = c => { const p = prog(c); return (isReview(p) ? 4 : p?.st === 1 ? 2 : 0) + (c.isD ? 0 : 1) - (c.deck === 'tagi' ? 8 : 0); };

/* what a pasted text would add, in its order: {c} a built-in card, {own} a word with its own meaning, {nw} a word the app doesn't have */
function analyzeImport(text, deckId){
  const a = {list: [], found: 0, mastered: 0, own: 0, unknown: [], dup: 0, bad: 0, fixed: []};
  const seen = new Set(), tgt = deckId && S.custom[deckId];
  if (tgt) for (const x of tgt.cards || []) { if (x.ref) seen.add(x.ref); if (x.w) seen.add('w:' + normW(x.w)); }
  const take = (...keys) => { if (keys.some(k => seen.has(k))) { a.dup++; return false; } keys.forEach(k => seen.add(k)); return true; };
  for (const raw of String(text || '').replace(/\r/g, '').split('\n')) {
    const line = raw.trim(); if (!line || line.startsWith('#')) continue;
    const f = line.includes('\t') ? line.split('\t') : splitCSV(line);
    if (f.length >= 2 && f.slice(1).some(x => JA.test(x))) {
      const it = parseImport(line)[0];
      if (!it) a.bad++; else if (take('w:' + normW(it.w))) { a.list.push({own: it}); a.own++; }
      continue;
    }
    for (const field of f) {
      if (!field.trim()) continue;
      const x = wordLine(field);
      if (!x) { if (/[a-z]/i.test(field)) a.bad++; continue; }
      const c = findBuiltin(x.w);
      if (c) {
        if (!take(c.deck + '|' + c.k, 'w:' + normW(c.w))) continue;
        a.list.push({c}); a.found++; if (status(prog(c)) === 'master') a.mastered++;
        if (normW(c.w) !== normW(x.w) && looseW(normW(c.w)) !== looseW(normW(x.w))) a.fixed.push(`${x.w}→${c.w}`);
      } else if (take('w:' + normW(x.w))) { a.list.push({nw: x}); a.unknown.push(x); }
    }
  }
  return a;
}

    else if (e.own) out.push(e.own);

/* The 辞書, the search box at the top of the 単語帳 tab, looks a word up in every deck: built-in headwords with all their
   meanings, their derivatives, the idioms and the words of your own decks (the results take the shelves' place). English: the word itself (e-mail, abandon's, took it for granted too), then its base form
   (abandoned → abandon, ran → run, knives → knife), then words that start with it, then words that hold it; nothing like it:
   もしかして (recieve → receive). Japanese: inside the meanings (放棄 → relinquish; りんご finds リンゴ). A word in several decks (fine:
   中学基礎 and 必修多義語) is one entry. From an entry a word goes into 「辞書で調べた単語」 (made on first use; a reference to
   the built-in card, so the record is shared; put first among the decks in use, so it comes soon) or gets a 苦手 mark (p.wk:
   「N回以上まちがえた単語」 and the 苦手 filter take it whatever its count). A word the app doesn't have is looked up on

    s[0].e = $('#ce').value.trim(); s[0].j = $('#cj').value.trim();
    if (f.dataset.k) {
      const c = d.cards.find(x => x.k === f.dataset.k); const old = customSenses(c);
      for (const n of s.slice(1)) { const o = old.find(x => x.m === n.m); if (o) { n.e = o.e; n.j = o.j; } }
      Object.assign(c, {w, s}); delete c.m; delete c.p; delete c.e; delete c.j;
      touchDeck(d.id); closeSheet(); render(); toast('保存しました');
    } else { d.cards.push(storeCard({w, s})); touchDeck(d.id); render(); cardForm(d.id, null); toast(`「${w}」を追加しました`); }
  }
});
/* tooltip for chart marks */
const tip = $('#tip');
document.addEventListener('pointerover', e => { const t = e.target.closest('[data-tip]'); if (!t) { tip.hidden = true; return; }
  const r = t.getBoundingClientRect(); tip.textContent = t.dataset.tip; tip.hidden = false;
  tip.style.left = clamp(r.left + r.width/2, 70, innerWidth - 70) + 'px'; tip.style.top = r.top + 'px'; });
document.addEventListener('pointerout', e => { if (e.target.closest?.('[data-tip]')) tip.hidden = true; });
addEventListener('scroll', () => { tip.hidden = true; }, {passive:true});
addEventListener('pagehide', () => { saveNow(); flush(); });

/* ---------- first run ---------- */
function forgetChart(){
  const W = 300, H = 120, X0 = 30, Y0 = 8, PW = W - X0 - 8, PH = H - Y0 - 22, days = 34, lo = 0.4;
  const x = t => X0 + t / days * PW, y = r => Y0 + (1 - (r - lo) / (1 - lo)) * PH;
  const R = (t, st) => Math.pow(1 + FACTOR * t / st, DECAY);
  const pts = (from, to, st) => { const a = []; for (let t = from; t <= to + 1e-9; t += 0.25) a.push(`${x(t).toFixed(1)},${y(R(t - from, st)).toFixed(1)}`); return a; };
  const stab = [1, 3, 8, 20]; let t = 0, d = '', dots = '';
  for (const st of stab) {                       // each review resets memory to 100% and the next decay is slower
    const end = Math.min(days, t + st);
    d += (d ? ' L' : 'M') + pts(t, end, st).join(' L');
    dots += `<circle cx="${x(t).toFixed(1)}" cy="${y(1).toFixed(1)}" r="3.2" class="fc-dot"/>`;
    t = end; if (t >= days) break;
  }
  const tEnd = (Math.pow(lo, 1 / DECAY) - 1) / FACTOR * stab[0];   // the no-review curve runs until it reaches the bottom of the chart
  const none = 'M' + pts(0, Math.min(days, tEnd), stab[0]).join(' L');
  const tick = v => `<text x="${X0 - 5}" y="${(y(v) + 3.5).toFixed(1)}" text-anchor="end">${Math.round(v * 100)}%</text>`;
  return `<svg class="fchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="復習すると記憶が保たれ、復習しないと記憶が下がっていくグラフ">
    <line x1="${X0}" x2="${X0 + PW}" y1="${y(0.9).toFixed(1)}" y2="${y(0.9).toFixed(1)}" class="fc-th"/>
    <line x1="${X0}" x2="${X0 + PW}" y1="${y(lo).toFixed(1)}" y2="${y(lo).toFixed(1)}" class="fc-ax"/>
    ${tick(1)}${tick(0.9)}${tick(0.6)}
    <path d="${none}" class="fc-none"/><path d="${d}" class="fc-rev"/>${dots}
    <text x="${(x(Math.min(days, tEnd)) + 4).toFixed(1)}" y="${(y(lo) - 3).toFixed(1)}" class="fc-lab-none">復習しない場合</text>
    <text x="${x(14).toFixed(1)}" y="${y(0.72).toFixed(1)}" class="fc-lab-rev">● ＝ アプリが出す復習</text>
    <text x="${X0}" y="${H - 6}" class="fc-x">覚えた日</text><text x="${X0 + PW}" y="${H - 6}" text-anchor="end" class="fc-x">${days}日後</text>
  </svg>`;
}
const hasProgress = () => Object.values(S.prog).some(d => d && Object.keys(d).length);
/* the first run: only what to choose, with the start buttons stuck to the bottom of the sheet (the longer story is 「アプリのしくみ」).
   Both choices come before the chart, so on a 375×812 phone the 1日の目標 is in view above the buttons; the nickname (なんて呼べばいい？, may be left empty) and the chart are below them */
/* the welcome's なんて呼べばいい？: kept when anything is typed (it can be left empty) */
function obNick(){ const n = cleanNick($('#obnick')?.value); if (n && n !== S.settings.nick) setSetting('nick', n); }
function onboard(){
  const opts = [['junior','中学基礎','中学〜高校基礎'], ['j1','受験英単語 基礎','高校の基本〜共通テスト'], ['j2','受験英単語 標準','共通テスト〜中堅大'], ['j3','受験英単語 発展','難関大・英検2級〜準1級の入口'], ['tagi','必修多義語','知っている基本語の、入試で問われる意味'], ['theme','テーマ別 長文頻出語','環境・医療・経済などの専門語']]
    .filter(([id]) => deckById(id));
  const main = opts.filter(([id]) => /^(j\d|junior)$/.test(id)), more = opts.filter(([id]) => !/^(j\d|junior)$/.test(id));
  const moreLab = more.map(([id]) => ({tagi: '多義語', theme: 'テーマ別'})[id]).filter(Boolean).join('・');
  const opt = ([id, name, sub], i) => `<label class="ob-opt"><input type="radio" name="obdeck" value="${id}" ${id === 'j1' ? 'checked' : ''}><b>${name}</b><small>${sub}</small></label>`;
  // opened from the iPhone's home screen with nothing here: the records are most likely in Safari, which keeps its own — logging in
  // comes first (an installed Android / desktop app shares the browser's records: nothing here means a new learner)
  const back = IS_WEB && !!FIREBASE && IOS && isStandalone();
  openSheet(`<div class="ob">
    <div class="ob-hd"><span class="ob-logo" aria-hidden="true">${BRAND ? `<i style="--brand:url(${BRAND})"></i>` : '極'}</span><h3>極（きわみ）へようこそ</h3></div>${iabNote()}
    ${back ? `<div class="ob-back">${mekuru('normal')}<div><b>Safariで使ってた？</b><span>ホーム画面の極は、Safariとは記録が別。ログインすると続きから使えるよ</span></div><button class="btn btn-primary btn-big btn-block" data-act="signIn">ログインで続きから</button></div>` : ''}
    <p class="ob-lead"><b>ぜんぶ無料で、広告もなし。登録しなくても使えます。</b>新しい単語はカードで覚えて、復習は4択でサクサク。忘れかけたころに復習が出るので、少ない回数で長く覚えられます。</p>
    <fieldset class="ob-f"><legend>どこから始める？</legend>
      ${main.map(opt).join('')}
      ${more.length ? `<details class="ob-more"><summary>ほかの単語帳${moreLab ? `（${moreLab}）` : ''}</summary>${more.map((o, i) => opt(o, main.length + i)).join('')}</details>` : ''}
    </fieldset>
    <fieldset class="ob-f"><legend>1日の目標（新しい単語）</legend><div class="ob-row">
      ${[10, 20, 30].map(n => `<label class="ob-chip"><input type="radio" name="obnew" value="${n}" ${n === 20 ? 'checked' : ''}><span>${n}語<small>${{10: 'ゆったり', 20: 'ふつう', 30: 'がっつり'}[n]}</small></span></label>`).join('')}
    </div><p class="ob-note">2日目からは、これに①復習のぶんが少し足されます</p></fieldset>
    <div class="ob-f"><label class="ob-lab" for="obnick">なんて呼べばいい？</label><input id="obnick" class="k-input ob-nick" type="text" maxlength="${NICK_MAX}" placeholder="ニックネームでOK（本名じゃなくていい）" autocomplete="nickname" enterkeyhint="done" spellcheck="false">
      <p class="ob-note">ほかの人には見えない、飛ばしてもOK</p></div>
    ${forgetChart()}
    <div class="ob-go"><button class="btn ${back ? 'btn-soft' : 'btn-primary'} btn-big btn-block" data-act="obStart" data-mode="swipe">知ってる単語を仕分けて始める<small>最大50語</small></button>
      <button class="btn btn-ghost btn-block" data-act="obStart" data-mode="study">仕分けずに、すぐ覚えはじめる</button>
      <div class="ob-links">${FIREBASE && !back ? '<button class="link" data-act="signIn">前に使っていた人はログイン</button>' : ''}<button class="link" data-act="obSkip">あとで決める</button></div></div>
  </div>`, true);
}
/* 設定 →「アプリのしくみ」: what めくる would say in three slides, kept here instead of before the first card (no slides):
   ① 忘れかけたころに、また出す (and 意味は1つずつ) ② めくったら、4つから選ぶ ③ 毎日の流れ (and what 制限時間 does: the four
   grades and a time-out, moved here from 設定 so its note is one line). It sets nothing */
function howSheet(){
  const gb = g => `<span class="grade g${g}">${['', 'もう一度', '難しい', '正解', '簡単'][g]}<small>${GRADE_FEEL[g]}</small></span>`;
  const say = (mood, t) => `<div class="tut still">${mekuru(mood)}<p class="tb">${t}</p></div>`;
  openSheet(`<div class="sheet-h"><h3>極のしくみ</h3><button class="iconbtn" data-act="closeSheet" aria-label="閉じる">${I.close}</button></div>
    ${say('normal', 'ぼく、めくる。きみの単語カード係だよ')}
    <section class="hw"><h4><span class="inum">1</span>忘れかけたころに、また出す</h4>${forgetChart()}
      <p>覚えた単語も、ほっとくと抜けていく。<b>抜けそうな日に、ぼくがもう一回出す</b>から、少ない回数で長く覚えられるよ。</p>
      <h5>意味は1つずつ</h5>
      <div class="hw-sense"><b lang="en">appear</b><span class="mp on"><i>1</i>現れる</span><span class="arr" aria-hidden="true">→</span><span class="mp"><i>2</i>〜のようだ</span></div>
      <p>意味が多い単語も、まず1つ。<b>覚えたら次の意味</b>が出てくる。派生語（decide → decision）も同じように1つずつ。</p></section>
    <section class="hw"><h4><span class="inum">2</span>めくったら、4つから選ぶ</h4>
      ${say('happy', '知らなかったら<b class="tk g1">もう一度</b>でOK。減点じゃなくて、おかわり。だいたい分かったら<b class="tk g3">正解</b>')}
      <ul class="hw-g4"><li>${gb(1)}<span><b>このあとすぐ、もう1回</b>同じセットの中で、4択でたしかめる</span></li>
        <li>${gb(2)}<span><b>明日また出る</b>今日のおさらいでも、もう1回</span></li>
        <li class="pick">${gb(3)}<span><b>数日あけて出る</b>だいたい思い出せたらこれ</span></li>
        <li>${gb(4)}<span><b>しばらく出ない</b>もう知ってる単語は先へ</span></li></ul>
      <p>テストじゃないので、自分の感覚で押してOK。</p></section>
    <section class="hw"><h4><span class="inum">3</span>毎日の流れ</h4>
      ${say('cheer', '毎日これだけ。ぼくはゴールで待ってる')}
      <ol class="path"><li class="step skip"><span class="node" aria-hidden="true">1</span><div class="sb"><div class="sh"><b>復習</b><span class="hw-tag">4択で、2日目から</span></div>
          <p class="sub">忘れかけた単語が戻ってくる。<b>速く正解するほど、次に出るのは先</b>になる</p></div></li>
        <li class="step now"><span class="node" aria-hidden="true">2</span><div class="sb"><div class="sh"><b>新しい単語</b><span class="hw-tag">カード</span></div>
          <p class="sub">1日の目標のぶん。1日目は②からスタート</p></div></li>
        <li class="step goal"><span class="node" aria-hidden="true">${I.flame}</span><div class="sb"><small>ゴール</small><b class="gl">連続 <span class="dpill"><b class="num">0</b>日</span><span class="arrow" aria-label="から">→</span><span class="dpill lit"><b class="num">1</b>日</span></b>
          <span class="gsub">連続記録がのびるのは、①と②がおわった日だけ</span></div></li></ol>
      <h5>制限時間をオンにすると</h5>
      <p class="hw-rate">${[1, 2, 3, 4].map(t => `<span class="rate t${t}">${RATE_NAME[t]}</span>`).join('<span aria-hidden="true">→</span>')}</p>
      <p>4択の復習は、<b>速く正解するほど評価が上がって</b>、次に出るのが先にのびるよ。時間切れは「わからない」と同じ（カードは「もう一度」、仕分けは「知らない」）。新しい単語のカードには、バーは出ないよ。</p></section>
    <p class="small muted kbd">キーボードでは、1問もどすは Backspace、4択は 1〜4、わからないは 0、次へは Enter、仕分けは ← →、めくるのは ↑</p>
    <button class="btn btn-ghost btn-block" data-act="closeSheet">閉じる</button>`);
}

/* ---------- boot ---------- */
function start(data){
  if (data && data.tab) { route.tab = data.tab; route.deck = data.deck || null; }
  tutInit();                                                                  // めくるの一言: on for a learner with nothing on record yet
  if (!S.settings.onboarded && hasProgress()) S.settings.onboarded = true;   // people who already study skip the welcome
  if (!S.ach || lsGet(ACH_VK) !== ACH_V) { achGrant(true); lsSet(ACH_VK, ACH_V); }   // 実績, the first time and when the list grows: everything the records already reach is put in quietly (no celebrations)
  applyZoom(); render(); initSync(); initFirebase();
  const boot = document.getElementById('boot');   // the first screen is up: the loading logo fades and goes
  if (boot) { requestAnimationFrame(() => { boot.classList.add('out'); setTimeout(() => boot.remove(), 260); }); }
  if (!S.settings.onboarded) onboard();
  if (lsGet('kiwami.updated')) { lsSet('kiwami.updated', ''); setTimeout(() => toast('新しい版になりました'), 600); }
}
try { window.claude?.hot?.snapshot?.(() => ({tab:route.tab, deck:route.deck})); } catch(e) {}
try { window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {}); } catch(e) { start({}); }
